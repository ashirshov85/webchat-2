  /api/v1/groups/{chatId}/members:
    post:
      operationId: addGroupMembers
      tags: [groups]
      summary: Добавить участников из контактов добавляющего (№31, Bearer)
      description: >
        Добавление участников (owner/admin — FR-002/FR-004): каждый
        элемент batch — контакт ДОБАВЛЯЮЩЕГО (фича 004); batch атомарен —
        любая невалидность (не-uuid, дубль, не-контакт, вместимость)
        отклоняет весь batch без частичных добавлений. Добавленные
        получают роль member. Идемпотентность: уже активные участники
        игнорируются (дубля в составе нет), возвращается текущий активный
        состав; добавление самого себя → 400 self_forbidden. Лимит:
        активные + batch > 200 → 409 group_full. Первое добавление
        инициализирует водяные знаки добавленного позицией группы
        (chats.last_seq — бейдж непрочитанных 0, FR-013); повторное
        добавление (после выхода/исключения) сохраняет водяные знаки и
        сбрасывает роль в member (FR-002). Всем активным участникам
        (включая добавленных) — group.member.added (№18): добавленному
        группа сразу видна в «Чатах».
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор группы
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembersRequest'
      responses:
        '200':
          description: Участники добавлены (или уже активны — идемпотентно) — текущий активный состав после операции
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members]
                properties:
                  members:
                    type: array
                    description: Текущий активный состав группы с ролями (≤200, включая добавленных)
                    items:
                      $ref: '#/components/schemas/GroupMember'
        '400':
          description: 'Не-uuid/дубли в userIds (errors: {userIds: [invalid_user_ids]}); добавляющий сам себе (errors: {userIds: [self_forbidden]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — участник с ролью member: состав не изменяет (errors: {group: [forbidden_role]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Группа не найдена или недоступна вызывающему — единый ответ (errors: {group: [group_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Активные + batch > 200 — конфликт вместимости, весь batch отклонён (errors: {group: [group_full]})'
          content:
