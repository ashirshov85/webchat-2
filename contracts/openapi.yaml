      description: >
        Создаёт группу: создатель получает роль owner, участники начального
        состава (из контактов создателя) — member (FR-001/FR-002).
        Валидация: название — trim, 1–64 символов; описание — ≤256;
        memberUserIds — uuid, без дублей, ≤199, без самого создателя;
        каждый элемент — контакт создателя (фича 004), иначе весь запрос
        отклоняется атомарно и группа не создаётся. Лимит участников —
        200 включая владельца: при исчерпании вместимости (заниженный
        groups.max-members) — 409 group_full; штатно начальный состав
        ≤199 + создатель ≤200 — ошибка недостижима. После создания всем
        активным участникам (включая создателя) публикуется
        group.member.added (№18).
