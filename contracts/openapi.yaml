openapi: 3.1.0
info:
  title: WebChat Public API
  version: 0.9.0
  description: >
    Публичный API веб-чата. Единственный источник истины публичного API;
    TypeScript-типы фронтенда генерируются из этого файла автоматически.

    Фича 002 (auth): endpoints №1–10 — регистрация с email-подтверждением,
    вход по паролю, refresh-ротация, logout, восстановление пароля, /users/me.
    Публичны ровно endpoints №1–6, №8–9 (8 путей); №7 logout и №10 /users/me
    требуют Bearer. Все ответы об ошибках — RFC 9457 application/problem+json
    (схема Problem). Ссылки в письмах указывают на маршруты SPA, а не на API.

    Фича 003 (sso): endpoints SSO §1–7 — вход через внешних
    identity-провайдеров (OIDC/OAuth2): перечень провайдеров,
    authorize/callback/token, привязка и отвязка идентичностей. Дополнительно
    публичны 4 маршрута (providers, authorize, callback, token);
    link/authorize, GET /users/me/identities и DELETE идентичности
    требуют Bearer. Endpoint'ы 002 не изменились (аддитивно, minor-бамп).

    Фича 004 (messaging): endpoints №11–24 — личные текстовые диалоги
    (ensure/чтение/удаление, история с курсорной пагинацией, отправка с
    клиентской дедупликацией, read-отметки), реалтайм-канал SSE
    №18 /users/me/events, контакты, точный поиск пользователей и
    блокировки (№19–24). Все новые пути требуют Bearer: публичный
    перечень 002–003 не расширен. Фиксированные константы: максимум текста
    сообщения — 4096 символов после trim; страница истории — 50 сообщений;
    флуд-лимит отправки — 30 сообщений/мин на пользователя; лимит поиска
    пользователей — 30 запросов/мин на пользователя. Изменение —
    только additive (0.3.0 → 0.4.0, без BREAKING.md).

    Фича 005 (delivery): endpoints №25–26 — подтверждение доставки
    (delivery-ack: батчевое монотонное GREATEST-продвижение позиции
    доставки, единственная операция, её двигающая) и догоняющая
    синхронизация (sync: per-chat курсоры, дельты SyncChatDelta по
    последней активности DESC); расширение №15 ascending-режимом after +
    nextAfter (дозагрузка новее курсора, after+before → 400
    mixed_cursors); №16 — новый временный отказ 503 server_busy +
    Retry-After (backpressure, дедуп-фастпас до admission). Фиксированные
    константы фичи: страница дельты/истории — 50 сообщений; чатов на
    ответ sync — 20 (max 50); элементов ack-батча — 100. Все новые пути
    требуют Bearer (/users/me/* — per-user, публичный перечень 002–003
    не расширен). Изменение — только additive (0.4.0 → 0.5.0,
    без BREAKING.md).

    Фича 006 (groups): endpoints №27–35 — групповые чаты с ролями
    (owner/admin/member) и member-авторизацией: создание группы с
    начальным составом из контактов, состав, метаданные, исключение,
    выход, роли и передача владения, hard-delete владельцем. №12/№13/№26
    получают optional group-поля (type/title/memberCount/myRole; №13 —
    ещё description/othersReadUpToSeq), peer-поля у group-элементов —
    null (nullable-переход); №18 — 6 новых event:-типов (group.updated,
    group.member.added, group.member.removed, group.role.changed,
    group.you_removed, group.deleted). Авторизация групп — active-членство
    на каждом запросе: не-участнику (включая бывшего) и для несуществующей
    группы — единый 404 group_not_found (существование не раскрывается);
    публичного каталога/поиска групп нет. Фиксированные константы фичи:
    лимит участников — 200 (включая владельца); название — 1–64 символов
    после trim; описание — ≤256 символов; окно прекращения доставки
    событий группы после исключения/выхода/удаления — ≤5 с. Константы
    004/005 (страница 50, флуд 30/мин, дедуп по clientMessageId) действуют
    в группах без изменений. Все новые пути требуют Bearer: публичный
    перечень 002–003 не расширен. Изменение — только additive
    (0.5.0 → 0.6.0, без BREAKING.md).

    Фича 007 (presence): endpoints №36–38 — присутствие пользователей
    (статус «онлайн»): batch-снапшот статусов отображаемых поверхностей
    №36, продление регистрации presence-heartbeat'ом №37, режим
    «невидимки» №38. №18 — 2 новых кадра: opening-фрейм
    connected {connectionId} и событие presence.updated
    {userId,status,rev} (аудитории видимости субъекта). Терминология
    keepalive: transport-keepalive :ka (кадр-комментарий каждые 15 с —
    удержание соединения) ≠ presence-heartbeat №37 (прикладное
    продление регистрации каждые 30 с). Фиксированные константы фичи:
    TTL регистрации — 90 c; интервал heartbeat — 30 c (3× запаса);
    batch №36 — ≤ 200 userIds после дедупа; окно гистерезиса «офлайн» —
    45 c (серия разрывов < окна → 0 событий); публикация «онлайн» —
    немедленная; logout — немедленный «офлайн» без окна. Новые problem-
    коды: presence_ids_too_many (400), presence_connection_not_found
    (404); flood_limit (429) переиспользован. Все новые пути требуют
    Bearer (/users/me/* — per-user, публичный перечень 002–003 не
    расширен). Изменение — только additive (0.6.0 → 0.7.0,
    без BREAKING.md).

    Фича 008 (reskin/T097): аддитивное поле blockedByMe: boolean в
    ContactView №20/№21 — единственный блок-снимок контакта, чей диалог
    удалён (№12 теряет скрытый чат, и состояние блокировки больше ниоткуда
    не проецируется — bug 16). Читается так же, как blockedByMe №12/№13
    (метка вызывающего, поле «кто заблокировал меня» отсутствует —
    FR-020); блокировки и контакты по-прежнему независимы (FR-017/FR-020),
    новых путей и problem-кодов нет. Изменение — только additive
    (0.7.0 → 0.8.0, без BREAKING.md).

    Фича 008a (social-signals): endpoints №39–№42 — отображаемые имена
    и социальные сигналы: обновление профиля с профильным именем
    displayName (№39, цепочка отображения alias → displayName → username),
    персональный alias контакта (№40, виден только запросчику),
    эфемерный сигнал набора текста (№41, состояние не читается —
    подключившимся не реплеится; DIRECT-блок-пара — 204 без публикации)
    и переключатель звуковых оповещений чата per-user-per-chat (№42,
    значение и факт настройки другим участникам не раскрываются; событие
    chat.sound.updated — только в собственный канал). Опциональные поля
    существующих схем: PublicUser.displayName (все $ref-поверхности,
    включая peer №26 sync-дельты), ContactView.alias, peer-фрагменты
    №11/№12/№13 (displayName, alias), GroupMember.user №28 (displayName,
    alias), результат поиска №19 (displayName, alias), ChatView/
    ChatListItem.soundEnabled, PresenceStatusItem.lastSeenAt и
    PresenceUpdatedEvent.lastSeenAt (только offline ∧ аудитория
    видимости 007 ∧ не инкогнито ∧ данные есть; отсутствие поля
    нейтрально). №18 — 3 новых event:-типа (typing.started,
    typing.stopped, chat.sound.updated). Фиксированные константы фичи:
    длина displayName/alias — 1–64 символа после trim; typing — окно
    повтора клиента 3 с, окно молчания 5 с, серверный TTL состояния 8 с,
    страховый таймаут наблюдателя 10 с, флуд 60 сигналов/мин;
    точность lastSeen ≤ TTL-модели 007 (регистрация 90 с + гистерезис
    45 с + poller 1 с); флуд №39/№40/№42 — 30/мин. Новые problem-коды:
    invalid_display_name (400), invalid_alias (400), contact_not_found
    (404), invalid_action (400); flood_limit (429) переиспользован.
    Серверные сортировки и семантика поиска №19 не меняются. Все новые
    пути требуют Bearer (/users/me/*, /contacts/*, /chats/* — per-user,
    публичный перечень 002–003 не расширен). Изменение — только
    additive (0.8.0 → 0.9.0, без BREAKING.md).
tags:
  - name: auth
    description: Регистрация, вход, сессии, восстановление пароля
  - name: users
    description: Данные пользователя
  - name: sso
    description: Вход через внешних identity-провайдеров (OIDC/OAuth2) и управление привязками
  - name: chats
    description: 'Личные текстовые диалоги: создание, история, отправка, прочтение, удаление'
  - name: realtime
    description: Реалтайм-канал SSE — поток событий пользователя (message.created, chat.read)
  - name: sync
    description: 'Позиция доставки: подтверждение (delivery-ack) и догоняющая синхронизация пропущенного'
  - name: contacts
    description: 'Контакты пользователя, точный поиск пользователей, блокировки'
  - name: groups
    description: 'Групповые чаты: создание, состав, роли, метаданные, выход и удаление'
  - name: presence
    description: 'Присутствие пользователей: batch-снапшот статусов, heartbeat-регистрации, режим «невидимки»'
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Регистрация (№1)
      description: >
        Создаёт аккаунт (pending_email_confirmation) и ставит письмо со ссылкой
        подтверждения в очередь. Полное совпадение пары (username+email) на
        незавершённом аккаунте возобновляет регистрацию без дубля. Занятые
        username/email аккаунтом любого статуса → 409 с указанием поля, без
        раскрытия статуса держателя.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Аккаунт создан или незавершённая регистрация возобновлена; письмо поставлено в очередь
        '400':
          description: Ошибка валидации полей (username/email); коды — в Problem.errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: username или email занят аккаунтом любого статуса; занятое поле указано, статус держателя не раскрывается
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP/email)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/register/resend:
    post:
      operationId: resendRegistrationEmail
      tags: [auth]
      summary: Повторная отправка письма регистрации (№2)
      description: >
        202 всегда единообразно — не раскрывает существование/статус аккаунта.
        pending_email_confirmation → письмо email_verification_repeat;
        awaiting_password (вкл. истечение setupToken) → письмо password_setup
        со ссылкой /set-password; active/несуществующий email → письмо не
        отправляется. Источник 429: сначала бакеты (IP/email), затем cooldown
        60 с на аккаунт (Retry-After = 60 − elapsed).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
      responses:
        '202':
          description: Принято единообразно (существование/статус аккаунта не раскрывается)
        '400':
          description: Ошибка валидации email
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит (IP/email) или cooldown 60 с на аккаунт
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/register/confirm:
    post:
      operationId: confirmRegistration
      tags: [auth]
      summary: Подтверждение email по ссылке (№3)
      description: >
        Поглощает одноразовый токен email_verification и выдаёт setupToken для
        задания пароля. Недействительная/использованная/истёкшая ссылка →
        единообразное 400 с предложением запросить новую (FR-012).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRegistrationRequest'
      responses:
        '200':
          description: Email подтверждён; выдан setupToken для задания пароля (TTL 1 ч)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [setupToken, setupTokenType, expiresInSec]
                properties:
                  setupToken:
                    type: string
                    pattern: '^[A-Za-z0-9_-]{43}$'
                    description: Одноразовый токен password_setup (256-bit, base64url)
                  setupTokenType:
                    type: string
                    const: password_setup
                  expiresInSec:
                    type: integer
                    minimum: 1
                    description: TTL setupToken, секунды (3600)
        '400':
          description: Токен недействителен, использован или истёк (единообразно; предложение запросить новую ссылку)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/register/password:
    post:
      operationId: setPassword
      tags: [auth]
      summary: Задание пароля после подтверждения email (№4)
      description: >
        Поглощает setupToken, проверяет политику пароля FR-004 (8–128 символов;
        не пустой/пробельный; вне топ-листа тривиальных; не совпадает с
        username/email) и устанавливает Argon2id-хеш; аккаунт → active.
        Неверный пароль/несовпадение подтверждения не поглощают setupToken.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Пароль установлен, аккаунт active
        '400':
          description: Токен недействителен / нарушение политики пароля / несовпадение confirmPassword
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Вход по username или email и паролю (№5)
      description: >
        identifier = username ИЛИ email. Неверный пароль / несуществующий
        идентификатор → единая 401 «Invalid credentials» (тайминговая защита —
        фиктивный Argon2-хеш). Незавершённый аккаунт → 403 «завершите
        регистрацию». Успех → пара токенов: access JWT ES256 (5 мин) + opaque
        refresh (3 дня sliding).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенов выдана; сессия создана
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    additionalProperties: false
                    required: [user]
                    properties:
                      user:
                        type: object
                        additionalProperties: false
                        required: [id, username, email]
                        properties:
                          id:
                            type: string
                            format: uuid
                          username:
                            type: string
                          email:
                            type: string
                            format: email
        '401':
          description: Единая обобщённая ошибка «Invalid credentials» (без различий причин)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Регистрация не завершена (подтвердите email / задайте пароль)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP/identifier) или блокировка подбора
          headers:
            Retry-After:
              description: Задержка до повтора, секунды (≈ остаток окна блокировки при подборе)
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Ротация refresh-токена (№6)
      description: >
        Выдаёт новую пару токенов, старый refresh поглощается (single-use).
        Повторное применение ротированного токена → компрометация цепочки:
        401, сессия и вся цепочка отозваны (FR-006). 401 единая, без различий
        (истёк / отозван / reuse).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов (ротация)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Единая ошибка (истёк / отозван / reuse-detected — без различий)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен IP-лимит
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Выход (№7, Bearer)
      description: >
        Отзывает сессию: access-токен должен быть действителен; переданный
        refresh отзывается, sid попадает в denylist (FR-011). Требует
        Authorization: Bearer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Сессия отозвана; оба токена недействительны
        '401':
          description: Не аутентифицирован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Запрос восстановления пароля (№8)
      description: >
        202 всегда единообразно — не раскрывает существование email (US4-4).
        Для существующего аккаунта ставит письмо с одноразовой ссылкой
        reset-password (TTL 1 ч) в очередь; предыдущие ссылки аннулируются.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Принято всегда единообразно (существование email не раскрывается)
        '400':
          description: Ошибка валидации email
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP/email)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Установка нового пароля по ссылке восстановления (№9)
      description: >
        Поглощает одноразовый токен password_reset, устанавливает новый пароль
        (политика FR-004) и отзывает все сессии пользователя (FR-010).
        Нарушение политики/несовпадение подтверждения не поглощают ссылку.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Пароль изменён; все сессии отозваны
        '400':
          description: Токен недействителен / нарушение политики пароля / несовпадение confirmPassword
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Текущий пользователь (№10, Bearer)
      description: Минимальный защищённый ресурс для проверки границы аутентификации (US3, SC-002).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные аутентифицированного пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/sso/providers:
    get:
      operationId: listSsoProviders
      tags: [sso]
      summary: Перечень включённых SSO-провайдеров (SSO §1)
      description: >
        Публичный перечень провайдеров для кнопок входа. Порядок — порядок
        объявления в конфигурации. Выключенные (enabled: false) и неизвестные
        провайдеры не видны. Пустой список валиден (SSO не настроен).
      security: []
      responses:
        '200':
          description: Включённые провайдеры в порядке конфигурации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoProvidersResponse'
        '429':
          description: Превышен лимит запросов (IP 30/1м)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/sso/authorize:
    post:
      operationId: ssoAuthorize
      tags: [sso]
      summary: Начало флоу входа через провайдера (SSO §2)
      description: >
        Создаёт флоу-контекст (state/PKCE S256/nonce, single-use, TTL 10 мин)
        и возвращает authorizationUrl для браузерного перехода на IdP —
        клиент обязан выполнить window.location.assign(authorizationUrl).
        Опциональный returnTo (только относительный путь) SPA сохраняет в
        sessionStorage до перехода и применяет после успешного обмена (SSO §4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoAuthorizeRequest'
      responses:
        '200':
          description: URL авторизации IdP (содержит state, nonce, PKCE code_challenge S256)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoAuthorizeResponse'
        '400':
          description: 'Невалидный returnTo: не-относительный путь или длина > 512 символов (errors: {returnTo: [invalid_format]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Провайдер неизвестен или выключен (единый ответ, без раскрытия перечня)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP 10/1м)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/sso/callback:
    get:
      operationId: ssoCallback
      tags: [sso]
      summary: Завершение флоу — браузерный редирект с IdP (SSO §3)
      description: >
        Не JSON-API: вызывается браузером редиректом с IdP; тело ответа пустое.
        Изымает флоу-контекст sso:flow:&lt;state&gt; (GETDEL; отсутствующий или
        повторный state → отказ до любых эффектов), обменивает code у
        провайдера (общий deadline 5 с на callback), верифицирует ID-токен
        (подпись JWKS, iss/aud/exp/nonce, непустой уникальный sub) и применяет
        резолвинг идентичности. Все исходы логируются в auth_events.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: state из флоу-контекста (single-use)
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Код авторизации IdP (присутствует при согласии пользователя)
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Ошибка от IdP (например access_denied) — маппится в sso_error=provider_error
          schema:
            type: string
      responses:
        '302':
          description: >
            Редирект браузера на SPA-маршрут. Варианты Location:
            /sso/callback?code=&lt;handshake&gt;&amp;state=&lt;state&gt; — успешный вход
            (handshake — одноразовый код, ^[A-Za-z0-9_-]{43}$, TTL 2 мин, для
            обмена в SSO §4); /settings/security?linked=&lt;providerId&gt; — успешная
            привязка (link-флоу); /sso/callback?sso_error=&lt;code&gt; — отказ входа;
            /settings/security?sso_error=&lt;code&gt; — отказ привязки. Публичные коды
            sso_error: invalid_state, provider_disabled, provider_error,
            email_not_verified, email_conflict, registration_incomplete,
            identity_taken, rejected — без секретов и деталей владельцев.
          headers:
            Location:
              description: Целевой маршрут SPA с code/linked или sso_error
              schema:
                type: string
                format: uri-reference
        '429':
          description: Превышен лимит запросов (IP 30/1м)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/sso/token:
    post:
      operationId: ssoToken
      tags: [sso]
      summary: Обмен handshake-кода на сессию (SSO §4)
      description: >
        Поглощает одноразовый handshake-код из callback (GETDEL, TTL 2 мин) и
        создаёт сессию, полностью идентичную парольной (№5 из 002): тот же
        формат TokenPair, та же ротация refresh, тот же logout и доступ к API.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoTokenRequest'
      responses:
        '200':
          description: Пара токенов выдана; SSO-сессия создана
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    additionalProperties: false
                    required: [user]
                    properties:
                      user:
                        type: object
                        additionalProperties: false
                        required: [id, username, email]
                        properties:
                          id:
                            type: string
                            format: uuid
                          username:
                            type: string
                          email:
                            type: string
                            format: email
        '400':
          description: 'Код неизвестен, использован или истёк — единый ответ без различения причин (errors: {code: [invalid_code]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP 30/1м)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/sso/link/authorize:
    post:
      operationId: ssoLinkAuthorize
      tags: [sso]
      summary: Начало флоу привязки провайдера (SSO §5, Bearer)
      description: >
        Аналогично SSO §2, но purpose=link: флоу-контекст связывается с текущим
        пользователем; результат — link-ветка callback (SSO §3, редирект на
        /settings/security). Повторная привязка уже своей идентичности —
        no-op success без дубля привязки.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoLinkAuthorizeRequest'
      responses:
        '200':
          description: URL авторизации IdP (содержит state, nonce, PKCE code_challenge S256)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoAuthorizeResponse'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Провайдер неизвестен или выключен (единый ответ, без раскрытия перечня)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Превышен лимит запросов (IP 10/1м)
          headers:
            Retry-After:
              description: Задержка до повтора, секунды
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/identities:
    get:
      operationId: listIdentities
      tags: [sso]
      summary: Список привязанных внешних идентичностей (SSO §6, Bearer)
      description: >
        Привязки текущего пользователя; порядок — по linkedAt (возрастание).
        providerDisplayName берётся из конфигурации; null, если провайдер
        удалён из конфига (привязка сохраняется).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список привязок пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitiesResponse'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/identities/{identityId}:
    delete:
      operationId: unlinkIdentity
      tags: [sso]
      summary: Отвязка внешней идентичности (SSO §7, Bearer)
      description: >
        Удаляет привязку; существующие сессии не отзываются — блокируются
        только новые входы через этого провайдера. Отвязка последнего способа
        входа запрещена (US3-4): сначала задайте пароль.
      security:
        - bearerAuth: []
      parameters:
        - name: identityId
          in: path
          required: true
          description: Идентификатор привязки
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Привязка удалена; сессии не отозваны
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Идентичность не найдена или принадлежит другому пользователю (единый ответ, без раскрытия деталей)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Отвязка последнего способа входа запрещена (errors: {identity: [last_login_method]}; сначала задайте пароль)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/chats/ensure:
    post:
      operationId: ensureChat
      tags: [chats]
      summary: Открыть личный диалог с пользователем (№11, Bearer)
      description: >
        Возвращает существующий диалог пары пользователей либо создаёт новый
        (201 — создан; 200 — уже существует). Повторное открытие существующего
        чата снимает hidden у вызывающего: чат возвращается в список; история,
        удалённая через №14, остаётся скрытой водяным знаком deleted_up_to_seq.
        Пара пользователей имеет ровно один диалог (idempotent ensure, FR-001).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureChatRequest'
      responses:
        '200':
          description: Диалог уже существует — возвращён существующий ChatView (hidden снят у вызывающего)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatView'
        '201':
          description: Диалог создан — ChatView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatView'
        '400':
          description: 'Невалидное тело (errors: {peerUserId: [invalid_uuid]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Собеседник не найден (errors: {peer: [peer_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Диалог с самим собой запрещён (errors: {peerUserId: [self_forbidden]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/chats:
    get:
      operationId: listChats
      tags: [chats]
      summary: Список чатов пользователя (№12, Bearer)
      description: >
        ChatListItem одним запросом. Серверная сортировка: последнее видимое
        сообщение (входящее или исходящее) по убыванию createdAt; чаты без
        видимых сообщений — ниже; исключены только удалённые без новых
        сообщений (hidden ∧ last_seq ≤ deleted_up_to_seq). Новый входящий
        снимает hidden и возвращает чат в список (FR-021). Превью
        lastMessage.text — полный текст (обрезка ≤64 симв. — клиентский
        рендер). С 006 список единый для direct-чатов и групп (FR-014):
        group-элементы несут type:'group', title, memberCount, myRole,
        а peer/blockedByMe = null; lastMessage/unreadCount/сортировка —
        без изменений; включаются только чаты с active-членством
        вызывающего. С 008a direct-элементы несут peer с профильным
        displayName, персональный peerAlias вызывающего к peer и
        персональный soundEnabled (звуковые оповещения чата вызывающего,
        смена — №42).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Чаты пользователя (direct и группы — единый список), отсортированные по последнему видимому сообщению
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [chats]
                properties:
                  chats:
                    type: array
                    description: По убыванию createdAt последнего видимого сообщения; пустой список валиден
                    items:
                      $ref: '#/components/schemas/ChatListItem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/chats/{chatId}:
    get:
      operationId: getChat
      tags: [chats]
      summary: Диалог по идентификатору (№13, Bearer)
      description: >
        ChatView пары с водяными знаками прочтения. Авторизация на уровне
        ресурса — membership диалога (FR-002): не-участник получает 403
        not_participant на существующем чате; несуществующий — 404.
        Группа (006): group-вариант ответа — type:'group', title,
        description, myRole, myReadUpToSeq, othersReadUpToSeq (MAX водяных
        знаков прочтения остальных активных участников — ✓✓ при прочтении
        хотя бы одним; 0 в группе из одного — ✓✓ не выставляется;
        монотонно, не сбрасывается новыми участниками; FR-012), memberCount;
        peer/blockedByMe/peerReadUpToSeq = null. С 008a peer direct-диалога
        несёт профильное displayName, ответ — персональный peerAlias
        вызывающего к peer и soundEnabled (звуковые оповещения чата
        вызывающего, смена — №42).
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор диалога
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Диалог
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatView'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — не участник диалога (errors: {chat: [not_participant]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Диалог не найден (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteChat
      tags: [chats]
      summary: Удаление диалога у себя (№14, Bearer)
      description: >
        Per-user удаление (FR-021): история скрывается водяным знаком
        deleted_up_to_seq = last_seq и hidden = true только у удалившего;
        второй участник не затронут. Новый входящий снимает hidden и
        возвращает чат в список — без старой истории (она остаётся за водяным
        знаком). Повторный вызов — 204 (идемпотентно).
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор диалога
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: История скрыта у вызывающего (идемпотентно)
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — не участник диалога (errors: {chat: [not_participant]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Диалог не найден (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/chats/{chatId}/messages:
    get:
      operationId: listMessages
      tags: [chats]
      summary: Страница истории диалога (№15, Bearer)
      description: >
        Два взаимоисключающих режима. before (DESC, 004): сообщения по seq
        DESC (новее — раньше), ровно те, что seq < before (курсор
        эксклюзивный); без before — последние видимые вызывающему
        (seq > deleted_up_to_seq); nextBefore — seq самой старой записи
        страницы, отсутствует, когда старее нет. after (ascending, 005):
        страницы (after, after+limit] по seq ASC — дозагрузка новее
        курсора (догоняющая синхронизация); nextAfter — seq последней
        записи страницы, отсутствует, когда новее нет. Пустая страница на
        границе в обоих режимах — корректный ответ (без nextBefore/
        nextAfter и без ошибок). limit 1–50, по умолчанию/максимум 50
        (FR-008); after и before одновременно → 400 mixed_cursors.
        Видимость — по deleted_up_to_seq вызывающего (per-user удаление
        004 не восстанавливается). Порядок стабилен между повторными
        загрузками (seq).
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор диалога
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          required: false
          description: 'Эксклюзивный курсор: только записи seq < before (seq самой старой записи предыдущей страницы)'
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: after
          in: query
          required: false
          description: 'Эксклюзивный ascending-курсор: только записи seq > after, по seq ASC — дозагрузка новее курсора; одновременно с before → 400 mixed_cursors'
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Размер страницы 1–50; по умолчанию 50 (фиксированный максимум — FR-008)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Страница истории (по seq DESC в режиме before/без курсора, по seq ASC в режиме after); пустая страница на границе — без nextBefore/nextAfter и без ошибок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          description: 'limit вне 1–50 (errors: {limit: [limit_out_of_range]}); after и before одновременно (errors: {after: [mixed_cursors]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — не участник диалога (errors: {chat: [not_participant]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Диалог не найден (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: sendMessage
      tags: [chats]
      summary: Отправка сообщения (№16, Bearer)
      description: >
        Exactly-once запись (FR-004/FR-012): clientMessageId — клиентский UUID,
        ретраи тем же id дают 200 существующей записи без дубля; id,
        принадлежащий другой записи, — 409. Текст: trim начальных/конечных
        пробелов, непустой, ≤4096 символов после trim (FR-003). Валидный текст
        записывается с сохранением внутренних пробелов. 201 — записано; 200 —
        дедупликация (запись уже существует). Флуд-лимит — 30 сообщений/мин на
        пользователя (FR-011): 31-е новое сообщение в окне → 429 flood_limit +
        Retry-After (сек до доступного токена); ретрай уже записанного
        сообщения (дедуп-путь) не штрафуется. Блокировка пары (FR-020):
        отправитель блокирует получателя → 403 chat_blocked_by_you; получатель
        блокирует отправителя → 403 you_are_blocked; записи нет.
        Backpressure (005, FR-009): при перегрузке пути отправки — поэтапная
        деградация (сначала рост задержки, затем 503 server_busy +
        Retry-After); порядок проверок — дедуп → admission (503) → membership
        → валидация → флуд (429) → блокировки → INSERT: дедуп-фастпас стоит
        раньше admission, повтор уже принятого сообщения тем же
        clientMessageId никогда не получает 503; флуд-лимит действует под
        пиком и не обходится повторами (FR-010).
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор диалога
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Дедупликация — clientMessageId уже записан, возвращена существующая запись Message (дубля нет)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '201':
          description: Сообщение записано — Message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: 'Валидация: text только из пробелов/переводов строк (errors: {text: [text_blank]}); длиннее 4096 символов после trim (errors: {text: [text_too_long]}); не-UUID clientMessageId (errors: {clientMessageId: [invalid_uuid]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — не участник (errors: {chat: [not_participant]}); отправитель блокирует получателя (errors: {chat: [chat_blocked_by_you]}); получатель блокирует отправителя (errors: {chat: [you_are_blocked]}) — записи нет'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Диалог не найден (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'clientMessageId принадлежит другой записи (errors: {clientMessageId: [message_id_conflict]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Флуд-лимит 30 сообщений/мин на пользователя (errors: {text: [flood_limit]}; FR-011) — записи нет'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'Временный отказ при перегрузке пути отправки — backpressure (errors: {chat: [server_busy]}; FR-009) — записи нет; повтор тем же clientMessageId в момент Retry-After. Дедуп-фастпас выполняется до admission: повтор уже принятого сообщения никогда не получает 503 (200); принятые доставляются в приоритете и не теряются'
          headers:
            Retry-After:
              description: Задержка до повтора, секунды (≥ 1 — оценка рассасывания очереди)
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/chats/{chatId}/read:
    post:
      operationId: markRead
      tags: [chats]
      summary: Отметить сообщения прочитанными (№17, Bearer)
      description: >
        Двигает водяной знак прочтения вызывающего до upToSeq включительно
        (FR-010). Идемпотентно и монотонно: повторное/меньшее upToSeq не
        откатывает и не публикует событие. upToSeq больше seq последнего
        сообщения диалога → 400 invalid_up_to_seq, водяной знак не двигается.
        При действующей блокировке пары (FR-020): вызывающий — блокирующий →
        204 без эффекта (водяной знак не двигается, событие не публикуется —
        «замирание»); вызывающий — заблокированный → 204, водяной знак
        двигается локально, событие блокирующему не публикуется.
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор диалога
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      responses:
        '204':
          description: Водяной знак продвинут (или без эффекта при повторном/меньшем upToSeq и при блокировке)
        '400':
          description: 'upToSeq меньше 1 или больше seq последнего сообщения диалога (errors: {upToSeq: [invalid_up_to_seq]}) — водяной знак не двигается'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — не участник диалога (errors: {chat: [not_participant]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Диалог не найден (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/events:
    get:
      operationId: streamUserEvents
      tags: [realtime]
      summary: Поток событий пользователя — SSE (№18, Bearer)
      description: >
        Единый realtime-поток событий пользователя (FR-022, US6): мультиплекс
        всех диалогов; каждое устройство/сессия открывает свой поток. Канал
        строго server→client: отправка — REST №16 (подтверждение = HTTP-ответ).
        Подключение: Authorization Bearer (тот же access JWT, что и REST;
        токен в URL запрещён) + Accept: text/event-stream. Фрейминг WHATWG
        SSE: первая строка потока — retry: 3000 (подсказка реконнекта);
        heartbeat-комментарий :ka каждые 15 с. Кадры: event: message.created |
        chat.read, за которым одна data:-строка с JSON-полем одной строкой,
        UTF-8. Событие message.created (FR-007) публикуется обоим участникам
        после коммита записи: payload {chatId, message: Message}; отправитель
        рендерит свои исходящие с других устройств сразу «доставлено»; клиент
        дедуплицирует по message.id. Событие chat.read (FR-010):
        payload {chatId, readUpToSeq, byUserId} — собеседник прочитал до
        readUpToSeq включительно; монотонно (повторные/меньшие не публикуются).
        Канал at-most-once: при (пере)подключении клиент выполняет рефетч
        REST (№12/№15); порядок/дубли исключены серверным seq и дедупом по id.
        Неизвестные клиенту event:-типы обязаны игнорироваться (прямая
        совместимость, US6-3).
        События групп (006): event: group.updated | group.member.added |
        group.member.removed | group.role.changed | group.you_removed |
        group.deleted — payloads Group*Event; идентификатор группы — поле
        groupId (= chatId). Адресат — активный участник группы на момент
        публикации (снимок состава в транзакции операции, публикация
        post-commit). group.you_removed — финальное событие группы в канале
        адресата: после него события группы не публикуются (окно
        прекращения ≤5 с, FR-010); клиент обязан удалить группу из «Чатов»,
        игнорировать последующие события этой группы (гонка порядка —
        сообщение, закоммиченное до исключения, может прийти позже) и
        исключить её из отложенных ack-батчей №25. Обработка групповых
        событий идемпотентна: применяется состояние (состав/роли/
        метаданные), а не дельты (FR-015); события группы не создают
        системных сообщений в истории. В группах message.created
        публикуется всем активным участникам, кроме отправителя (FR-011);
        chat.read — всем активным, кроме читавшего.
        Присутствие (007): сразу после retry: 3000 сервер отправляет
        opening-фрейм event: connected с payload ConnectedEvent
        {connectionId} — идентификатор регистрации подключения,
        используется клиентом в heartbeat №37; живёт вместе с потоком:
        реконнект выдаёт новый connectionId, старая регистрация
        самоистекает по TTL. Событие event: presence.updated с payload
        PresenceUpdatedEvent {userId, status, rev} публикуется каждому
        члену аудитории видимости субъекта (общий чат ∪ «субъект в
        контактах наблюдающего» − блок-пары − сам субъект) ровно один
        раз на переход, независимо от числа общих чатов; userId —
        субъект смены (не наблюдатель); status — опубликованное online
        | offline (online — немедленно, offline — гистерезис-задержано
        окном 45 c); rev — монотонная ревизия per-user: применять
        только строго большее rev (дубль/задержавшийся кадр — no-op);
        режим «невидимки» замораживает исходящие события субъекта.
        Терминология keepalive: transport-keepalive :ka — кадр-
        комментарий каждые 15 с, удерживает TCP-соединение и к
        регистрации присутствия не относится; presence-heartbeat №37 —
        прикладное продление регистрации каждые 30 c (отдельный REST-
        вызов); 404/429 на №37 не влияют на :ka, и наоборот.
        Социальные сигналы (008a): event: typing.started | typing.stopped
        с payload TypingStartedEvent/TypingStoppedEvent {chatId, userId} —
        эфемерный сигнал набора текста; публикуется активным участникам
        чата кроме отправителя сигнала при каждом валидном start №41
        (включая продления — окно повтора клиента 3 с) и при завершении:
        stop №41 (только при активном состоянии — идемпотентность),
        успешной отправке сообщения №16 печатающим, серверном истечении
        состояния (TTL 8 с, poller 1 с — событие stopped ≤ TTL +
        poll-interval). Нормативные константы: окно повтора клиента 3 с,
        окно молчания клиента 5 с, серверный TTL состояния 8 с,
        страховой таймаут наблюдателя 10 с, флуд-лимит сигналов 60/мин.
        DIRECT-блок-пара — без публикации в обе стороны (сигнал
        принимается 204); состояние не читается, не сохраняется и не
        реплеится при (пере)подключении (эфемерность). event:
        chat.sound.updated с payload ChatSoundUpdatedEvent {chatId,
        soundEnabled} — только в собственный канал пользователя при
        успешной смене №42 (мультидевайс ≤ 2 с; повтор того же
        значения — без события); другие участники чата событие не
        получают (приватность). presence.updated (007) с 008a может
        нести опциональное lastSeenAt при offline-переходе субъекта в
        рамках аудитории видимости (правила раскрытия и точность —
        в схеме PresenceUpdatedEvent). Неизвестные клиенту event:-типы
        обязаны игнорироваться (прямая совместность, US6-3) — механизм
        аддитивности новых событий.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'SSE-поток событий пользователя (text/event-stream): retry: 3000 в первом кадре, heartbeat :ka каждые 15 с, opening-фрейм connected (007), события message.created, chat.read, presence.updated (007), события групп (group.updated, group.member.added, group.member.removed, group.role.changed, group.you_removed, group.deleted), typing.started, typing.stopped, chat.sound.updated (008a); фрейминг и payloads — в описании операции'
          headers:
            X-Accel-Buffering:
              description: 'no — отключение буферизации прокси (кадры доставляются немедленно, без агрегации за ingress)'
              schema:
                type: string
                const: no
          content:
            text/event-stream:
              schema:
                type: string
                description: Сырой SSE-поток (текст по спецификации WHATWG)
              examples:
                streamSample:
                  summary: 'Первый кадр (retry) + opening-фрейм connected + события message.created, chat.read, presence.updated, group.member.added, group.you_removed, typing.started, typing.stopped, chat.sound.updated, presence.updated с lastSeenAt + heartbeat'
                  value: |
                    retry: 3000

                    event: connected
                    data: {"connectionId":"7c9e6679-7425-40de-944b-e07fc1f90ae7"}

                    event: message.created
                    data: {"chatId":"7dc5f5c0-0000-4a10-8b00-000000000001","message":{"id":"0b0f5e70-0000-4c20-9d00-000000000002","chatId":"7dc5f5c0-0000-4a10-8b00-000000000001","senderId":"9a2c8e40-0000-4d30-a100-000000000003","text":"Привет","seq":128,"createdAt":"2026-09-20T12:00:00.123Z"}}

                    event: chat.read
                    data: {"chatId":"7dc5f5c0-0000-4a10-8b00-000000000001","readUpToSeq":128,"byUserId":"9a2c8e40-0000-4d30-a100-000000000003"}

                    event: presence.updated
                    data: {"userId":"9a2c8e40-0000-4d30-a100-000000000003","status":"online","rev":42}

                    event: group.member.added
                    data: {"groupId":"7dc5f5c0-0000-4a10-8b00-000000000002","user":{"id":"c41d1a10-0000-4f40-b200-000000000004","username":"carol","email":"carol@example.com","status":"active","createdAt":"2026-09-01T10:00:00Z"},"actorId":"0f1e6c60-0000-4e50-c300-000000000005"}

                    event: group.you_removed
                    data: {"groupId":"7dc5f5c0-0000-4a10-8b00-000000000002","reason":"kicked"}

                    event: typing.started
                    data: {"chatId":"7dc5f5c0-0000-4a10-8b00-000000000001","userId":"9a2c8e40-0000-4d30-a100-000000000003"}

                    event: typing.stopped
                    data: {"chatId":"7dc5f5c0-0000-4a10-8b00-000000000001","userId":"9a2c8e40-0000-4d30-a100-000000000003"}

                    event: chat.sound.updated
                    data: {"chatId":"7dc5f5c0-0000-4a10-8b00-000000000001","soundEnabled":false}

                    event: presence.updated
                    data: {"userId":"9a2c8e40-0000-4d30-a100-000000000003","status":"offline","rev":43,"lastSeenAt":"2026-09-20T12:10:03Z"}

                    :ka
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Точный поиск пользователя по email или логину (№19, Bearer)
      description: >
        Точное совпадение полного email ИЛИ полного логина, без учёта
        регистра (FR-016): query содержит @ → сравнение lower(email),
        иначе lower(username) — username не допускает @ (правило 002).
        Результат — 0..1 пользователь: пустой список — корректный ответ
        (совпадения нет, edge). С 008a найденный несёт профильное
        displayName (если задано) и alias вызывающего (если найденный —
        его контакт); серверная семантика поиска не меняется (точное
        совпадение, без сортировки по displayName). Защита от перебора
        (FR-016): не более
        30 запросов/мин на пользователя — 31-й запрос в окне →
        429 flood_limit + Retry-After (сек до доступного токена), поиск
        не выполняется.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: 'Полный email или полный логин искомого пользователя; отсутствует, пустой или длиннее 254 символов → 400 query_missing'
          schema:
            type: string
            minLength: 1
            maxLength: 254
      responses:
        '200':
          description: Результат точного поиска — 0..1 пользователь (пустой список — корректный ответ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersSearchResponse'
        '400':
          description: 'query отсутствует, пустой или длиннее 254 символов (errors: {query: [query_missing]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Лимит поиска 30 запросов/мин на пользователя — защита от перебора (errors: {query: [flood_limit]}; FR-016); поиск не выполняется'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: Список контактов пользователя (№20, Bearer)
      description: >
        Контакты вызывающего с серверной алфавитной сортировкой по
        выбранному полю без учёта регистра (FR-015): sort=login — по
        lower(username) (по умолчанию), sort=email — по lower(email).
        Пустой список — корректный ответ. Каждый ContactView несёт
        blockedByMe — собственную блокировку контакта вызывающим (008/
        T097): проекция живёт и без чата (диалог удалён), сходимость с
        blockedByMe №12 при живом чате — то же отношение user_blocks.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          description: 'Поле серверной алфавитной сортировки без учёта регистра; по умолчанию login; иное значение → 400 invalid_sort'
          schema:
            type: string
            enum: [login, email]
            default: login
      responses:
        '200':
          description: Контакты, отсортированные алфавитно по выбранному полю без учёта регистра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
        '400':
          description: 'sort не login и не email (errors: {sort: [invalid_sort]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: addContact
      tags: [contacts]
      summary: Добавить пользователя в контакты (№21, Bearer)
      description: >
        Односторонняя запись в личный список контактов вызывающего
        (FR-016). 201 — контакт создан; 200 — уже добавлен, дубль не
        создаётся (edge). Добавление самого себя → 422 self_forbidden.
        Контакты не зависят от чатов и блокировок: удаление контакта (№22)
        не затрагивает единый диалог пары (FR-017); блокировка не
        затрагивает контакты (FR-020) — заблокированный может добавлять
        блокирующего в свои контакты.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
                  description: Добавляемый пользователь; добавление самого себя → 422 self_forbidden
      responses:
        '200':
          description: Контакт уже добавлен — возвращён существующий ContactView (дубль не создаётся)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactView'
        '201':
          description: Контакт создан — ContactView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactView'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Пользователь не найден (errors: {user: [user_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Добавление самого себя в контакты запрещено (errors: {userId: [self_forbidden]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contacts/{userId}:
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Удалить контакт (№22, Bearer)
      description: >
        Удаляет пользователя из списка контактов вызывающего. Идемпотентно:
        несуществующий контакт — тоже 204. Удаление контакта — независимая
        операция: единый диалог пары и его история не затрагиваются,
        переписка остаётся доступной и продолжается (FR-017).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Удаляемый из контактов пользователь
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Контакт удалён (идемпотентно; чат и история пары не затронуты)
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/{userId}/block:
    put:
      operationId: blockUser
      tags: [contacts]
      summary: Заблокировать пользователя (№23, Bearer)
      description: >
        Односторонняя блокировка, управляется блокирующим (FR-020).
        Идемпотентно: повторная блокировка — 204 без изменений (edge).
        Пока блок действует: отправка в диалоге пары запрещена в обе
        стороны без создания записей (№16 → 403 chat_blocked_by_you у
        блокирующего, 403 you_are_blocked у заблокированного — единственное
        явное уведомление заблокированного); прочтения блокирующего не
        двигают водяной знак и не публикуются, прочтения заблокированного
        двигают водяной знак локально без публикации (№17); бейдж
        непрочитанных у блокирующего «замирает» (№12). Контакты не
        затрагиваются. Единственная проекция блокировки в API —
        blockedByMe; поле «кто заблокировал меня» отсутствует. Разблокировка
        — №24.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Блокируемый пользователь
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Блокировка установлена (идемпотентно — повторная блокировка без изменений)
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Пользователь не найден (errors: {user: [user_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Блокировка самого себя запрещена (errors: {userId: [self_forbidden]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: unblockUser
      tags: [contacts]
      summary: Разблокировать пользователя (№24, Bearer)
      description: >
        Снимает блокировку вызывающего с пользователя. Идемпотентно:
        разблокировка не заблокированного — тоже 204. Возвращает обычное
        поведение диалога — отправку, прочтения, бейдж и события прочтения
        (FR-010) — без потери истории (FR-020).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Разблокируемый пользователь
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Блокировка снята (идемпотентно); обычное поведение диалога возобновляется
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/delivery-ack:
    post:
      operationId: deliveryAck
      tags: [sync]
      summary: Подтверждение доставки сообщений (№25, Bearer)
      description: >
        Батчевое монотонное продвижение позиции доставки вызывающего
        (delivered_up_to_seq, FR-001): GREATEST-обновление по каждому
        элементу — повторное/меньшее upToSeq без эффекта, идемпотентно.
        Весь батч атомарен (одна транзакция): отказ любого элемента —
        весь батч отклоняется, частичных эффектов нет. Единственная
        операция, двигающая позицию доставки: ни sync-ответ (№26), ни
        SSE-кадр (№18) её не пишут; ack не порождает realtime-событий
        (позиция — приватное состояние). Источники ack клиента:
        применённые realtime-кадры (дебаунс-батчер, флаш ≤ 1 с),
        применённые страницы №26/№15, точка обрезки truncatedUpToSeq.
        Батч — 1–100 элементов.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAckRequest'
      responses:
        '204':
          description: Позиция доставки продвинута (или без эффекта при повторном/меньшем upToSeq — идемпотентно); весь батч применён одной транзакцией
        '400':
          description: 'upToSeq < 1 или больше seq последнего сообщения чата (errors: {upToSeq: [invalid_up_to_seq]}); не-UUID chatId (errors: {chatId: [invalid_uuid]}) — весь батч отклоняется, позиция не двигается'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Чужой чат в батче — весь батч отклонён (errors: {chat: [not_participant]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Несуществующий чат в батче — весь батч отклонён (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/sync:
    post:
      operationId: sync
      tags: [sync]
      summary: Догоняющая синхронизация пропущенных сообщений (№26, Bearer)
      description: >
        Возвращает чаты вызывающего с недоставленным (эффективный курсор
        < максимальный видимый seq) — по последней активности DESC
        (первыми чаты с самыми новыми сообщениями), до chatLimit;
        moreChats — недоставленные чаты остались за пределами страницы.
        cursors — карта клиентских курсоров: сервер применяет её как
        нижнюю границу своей позиции (эффективный курсор =
        max(клиентский, серверный)); чужие/несуществующие chatId в
        cursors молча игнорируются (per-user операция — в отличие от
        атомарного батча №25). Дельта чата: startAfterSeq — эффективный
        курсор возобновления (после обрезки/ремонта клиент продвигает
        локальный курсор до него); truncatedUpToSeq — точка обрезки
        (сообщения ниже недоступны, не непрочитаны; позиция/курсор
        закрепляются на ней ack'ом); messages — ascending
        (startAfterSeq, …] ≤ messageLimit, только видимые, включая
        исходящие пользователя; hasMore — хвост за пределами страницы
        (продолжение — №15 after); peerReadUpToSeq — накопленные
        оффлайн ✓✓ собственных сообщений; unreadCount — серверный
        счётчик; lastSeq — chats.last_seq; desynced + serverUpToSeq —
        per-chat ремонт «курсора из будущего» без ошибки запроса.
        Операция не двигает позицию доставки (только ack №25);
        консистентность — один снимок чтения: либо полный корректный
        ответ, либо 5xx для повтора («частичный список как полный»
        исключён). Порядок и границы — только по серверному seq; часы
        клиента не участвуют.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Дельты чатов с недоставленным, по последней активности DESC; пустой список — доставлено всё (корректный ответ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: 'chatLimit/messageLimit вне 1–50 (errors: {chatLimit: [limit_out_of_range]} / {messageLimit: [limit_out_of_range]}); не-UUID chatId в cursors (errors: {chatId: [invalid_uuid]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/groups:
    post:
      operationId: createGroup
      tags: [groups]
