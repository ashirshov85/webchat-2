  /api/v1/users/me/presence:
    get:
      operationId: getPresenceSnapshot
      tags: [presence]
      summary: Batch-снапшот статусов присутствия (№36, Bearer)
      description: >
        Batch-чтение статусов присутствия для отображаемых поверхностей
        (FR-006): открытый чат + смонтированные элементы списков «Чаты»
        и «Контакты» текущего экрана; попадание в вьюпорт не
        отслеживается, серверу определение поверхности неизвестно —
        клиент передаёт userIds (≤ 200 после дедупа). Появление новой
        поверхности триггерит догрузку только для недостающих userIds;
        если отображаемые поверхности суммарно > 200, клиент разбивает
        запрос на несколько №36 по ≤ 200 (приоритет — открытый чат,
        затем элементы списков); запросы независимы, серверной
        координации не требуется. Статусы: online/offline — последний
        опубликованный статус (единая гистерезисная семантика с
        presence.updated, FR-004: в окне pending-offline снимок
        возвращает online — расхождения снимок/событие исключены);
        unknown — единая семантика «нет доступа» (вызывающий вне
        аудитории видимости цели или блок-пара; не различает «офлайн»
        и «скрыто» — FR-007); несуществующий userId — unknown (не
        раскрывает существование); цель в режиме «невидимки» — offline,
        неотличимо от реального офлайна (FR-007). rev — ревизия
        статуса цели: клиент сливает снимок с событиями №18 по
        max(rev) per-user (идемпотентность FR-003: дубль кадра,
        задержавшийся кадр, устаревший снимок — no-op). С 008a
        offline-элементы могут нести опциональное lastSeenAt — время
        последней активности presence-канала цели; условия раскрытия
        и точность — в схеме PresenceStatusItem (отсутствие поля
        нейтрально, SC-002). Цикл вызова —
        (re)connect 005 (после sync/chats/contacts) и открытие новых
        поверхностей. Флуд-контроль — per-user бакет: 429 flood_limit +
        Retry-After (консервативно, как №26).
      security:
        - bearerAuth: []
      parameters:
        - name: userIds
          in: query
          required: true
          description: 'UUID целей через запятую, ≤ 200 после дедупа; пустой/не-UUID в списке → 400 malformed_request; > 200 → 400 presence_ids_too_many'
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 'Статусы запрошенных целей: online/offline — последний опубликованный статус + rev; вне аудитории видимости, блок-пара или несуществующий — unknown'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceSnapshotResponse'
        '400':
          description: '> 200 userIds после дедупа (errors: {userIds: [presence_ids_too_many]}); пустой/не-UUID в списке (errors: {userIds: [malformed_request]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Per-user флод-бакет batch-снапшотов исчерпан — снапшот не выполняется, повторить после Retry-After (errors: {userIds: [flood_limit]})'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/presence/heartbeat:
    post:
      operationId: presenceHeartbeat
      tags: [presence]
      summary: Продление регистрации присутствия (№37, Bearer)
      description: >
        Прикладной presence-heartbeat: атомарно (Lua) продлевает все
        горизонты регистрации подключения до now + 90 c. Параметры
        контракта (FR-002): TTL регистрации 90 c, интервал heartbeat
        30 c (3× запаса), гарантия обнаружения тишины ≤ TTL +
        гистерезис + 2× poller-interval. connectionId — из opening-фрейма
        connected канала №18 (007); живёт вместе с потоком: реконнект
        выдаёт новый connectionId, старая регистрация самоистекает по
        TTL. Терминология: presence-heartbeat №37 (прикладной —
        продлевает регистрацию присутствия, интервал 30 c) ≠
        transport-keepalive SSE-канала №18 — кадр-комментарий :ka каждые
        15 с (удерживает TCP-соединение, к регистрации присутствия не
        относится); 404/429 на №37 не влияют на :ka, и наоборот.
        Реакция клиента: 404 — немедленный reconnect SSE
        (connectionId неизвестен/истёк); 429 — сохранить SSE-соединение
        и повторить heartbeat в следующем интервале (TTL 90 c даёт 3×
        запас); немедленный reconnect — только на 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceHeartbeatRequest'
      responses:
        '204':
          description: 'Регистрация продлена до now + 90 c (атомарно: alive + watch)'
        '400':
          description: 'Тело отсутствует, connectionId не задан или не UUID (errors: {connectionId: [malformed_request]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'connectionId неизвестен или истёк (errors: {connectionId: [presence_connection_not_found]}) — реакция клиента: немедленный reconnect SSE'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Per-user бакет heartbeat исчерпан (~10 запросов/30 c — допуск на джиттер, реконнекты и мультидевайс; errors: {connectionId: [flood_limit]}) — сохранить SSE-соединение, повторить в следующем интервале'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/presence/settings:
    get:
      operationId: getPresenceSettings
      tags: [presence]
      summary: Настройки видимости присутствия (№38, Bearer)
      description: >
        Текущее значение режима «невидимки» (FR-007). Режим действует
        на пользователя целиком, не на устройство; переживает сессии
        (хранится per-user). «Невидимка» виден окружающим как «офлайн»
        (неотличимо от реального офлайна), сам читает статусы №36 без
        ограничений. Единая операция для standalone SPA и виджета.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущее значение режима «невидимки»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceSettingsResponse'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: updatePresenceSettings
      tags: [presence]
      summary: Изменение режима «невидимки» (№38, Bearer)
      description: >
        Идемпотентный PUT: повтор той же величины — no-op без событий.
        Семантика переключения: включение при живых подключениях
        публикует аудитории видимости ровно одно переключение в offline
        и замораживает дальнейшие события субъекта; выключение
        публикует фактический статус (если фактический совпадает с
        публикуемым — только продвижение rev, без события); на
        переключение — ≤ одной смены индикатора у наблюдателей.
        Флуд-контроль — per-user бакет: 429 flood_limit + Retry-After
        (консервативно, как №26/№36).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceSettingsUpdateRequest'
      responses:
        '200':
          description: Сохранённое значение режима «невидимки» (повтор той же величины — no-op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceSettingsResponse'
        '400':
          description: 'incognito отсутствует или не boolean (errors: {incognito: [malformed_request]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Per-user флод-бакет PUT исчерпан (errors: {incognito: [flood_limit]})'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/me/profile:
    put:
      operationId: updateMyProfile
      tags: [users]
      summary: Обновить мой профиль (№39, Bearer)
      description: >
        Задаёт или сбрасывает профильное отображаемое имя displayName
        вызывающего (FR-001): цепочка отображения у наблюдателей —
        alias → displayName → username. null/отсутствие поля = сброс
        (имя не задано, отображение по username); пустая или состоящая
        только из пробелов строка → 400 (сброс — только явный null).
        Валидация: серверный trim, допустимая длина 1–64 символа после
        trim, Unicode без ограничений (кириллица/латиница/эмодзи).
        Идемпотентно: повтор того же значения — 200 без побочных событий
        (realtime-события смены имени нет — рефетч-семантика).
        Флуд-контроль — per-user бакет 30/мин (паритет №38):
        429 flood_limit + Retry-After.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Обновлённое представление пользователя (с displayName, если задано)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '400':
          description: 'displayName пусто/пробельно после trim или длиннее 64 символов (errors: {displayName: [invalid_display_name]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Per-user флод-бакет 30/мин исчерпан (errors: {displayName: [flood_limit]})'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contacts/{userId}/alias:
    put:
      operationId: setContactAlias
      tags: [contacts]
      summary: Задать/сбросить персональный alias контакта (№40, Bearer)
      description: >
        Персональный alias контакта в списке вызывающего — старший
        элемент цепочки отображения alias → displayName → username
        (FR-002/FR-003). null/отсутствие поля = сброс (отображение по
        displayName/username); пустая или состоящая только из пробелов
        строка → 400 (сброс — только явный null). Валидация: серверный
        trim, допустимая длина 1–64 символа после trim, Unicode без
        ограничений. Alias виден только вызывающему во всех его
        представлениях — сам контакт и третьи лица его не получают.
        Идемпотентность — последний write wins. Жизненный цикл: alias
        переживает удаление чата и удаляется вместе с контактом (№22).
        Флуд-контроль — per-user бакет 30/мин: 429 flood_limit +
        Retry-After.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Контакт вызывающего, для которого задаётся alias
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasUpdateRequest'
      responses:
        '200':
          description: 'Сохранённое представление контакта: user (PublicUser с displayName), alias?, createdAt, blockedByMe'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactView'
        '400':
          description: 'alias пусто/пробельно после trim или длиннее 64 символов (errors: {alias: [invalid_alias]}); не-UUID userId (errors: {userId: [invalid_uuid]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'userId не является контактом вызывающего (errors: {userId: [contact_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Per-user флод-бакет 30/мин исчерпан (errors: {alias: [flood_limit]})'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/chats/{chatId}/typing:
    post:
      operationId: sendTypingSignal
      tags: [chats]
      summary: Сигнал набора текста в чате (№41, Bearer)
      description: >
        Эфемерный сигнал набора текста (FR-006–FR-009): start — начало
        или продление набора, stop — завершение; 204 — сигнал принят
        (повтор start = продление, идемпотентно). Публикация через канал
        №18: start → typing.started {chatId, userId} активным участникам
        чата кроме отправителя (own-устройства свой набор не отображают —
        решается адресацией); stop → typing.stopped той же аудитории
        только при активном состоянии (повторный stop без активного
        состояния — без публикации, идемпотентность). Нормативные
        константы (фиксация таймингов в публичном контракте): окно
        повтора клиента start — 3 с; окно молчания клиента до stop — 5 с;
        серверный TTL состояния набора — 8 с (самоистечение →
        typing.stopped не позднее TTL + poll-interval 1 с); страховый
        таймаут индикатора наблюдателя — 10 с без продления; флуд-лимит —
        60 сигналов/мин на пользователя. Состояние эфемерно: операции
        чтения нет, в историю/sync не попадает, подключившимся не
        реплеится. DIRECT-блок-пара (обе стороны, 004 FR-020): сигналы
        принимаются 204 при валидном членстве, но не публикуются в обе
        стороны — наблюдатели дребезга не видят. Флуд-контроль — per-user
        бакет 60/мин (все чаты пользователя): 429 flood_limit +
        Retry-After; избыточные сигналы не публикуются.
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор чата
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypingRequest'
      responses:
        '204':
          description: 'Сигнал принят (идемпотентно: повтор start = продление)'
        '400':
          description: 'action не задан или вне start|stop (errors: {action: [invalid_action]}); не-UUID chatId (errors: {chatId: [invalid_uuid]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — не участник чата (errors: {chat: [not_participant]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Чат не найден (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Флуд-лимит 60 сигналов/мин на пользователя (errors: {action: [flood_limit]}; избыточные сигналы не публикуются)'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/chats/{chatId}/sound:
    put:
      operationId: setChatSound
      tags: [chats]
      summary: Переключить звуковые оповещения чата (№42, Bearer)
      description: >
        Персональный (per-user-per-chat) переключатель звуковых оповещений
        (FR-012–FR-015). Смена значения → realtime-событие
        chat.sound.updated {chatId, soundEnabled} только в собственный
        канал №18 вызывающего (синхронизация мультидевайс ≤ 2 с); повтор
        того же значения — 200 без события (идемпотентность). Приватность:
        значение и факт настройки не раскрываются другим участникам — ни
        в представлениях, ни в событиях. Подключающиеся/переподключающиеся
        клиенты читают актуальное состояние из soundEnabled №12/№13;
        событие — только для живых подключений. Без сети операция не
        выполняется (офлайн-очереди переключений нет). Флуд-контроль —
        per-user бакет 30/мин: 429 flood_limit + Retry-After.
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Идентификатор чата
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSoundRequest'
      responses:
        '200':
          description: 'Сохранённое значение: ChatSoundResponse {soundEnabled}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSoundResponse'
        '400':
          description: 'enabled отсутствует или не boolean (errors: {enabled: [malformed_request]}); не-UUID chatId (errors: {chatId: [invalid_uuid]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не аутентифицирован (нет токена / истёк / отозван / недействителен — единообразно)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Вызывающий — не участник чата (errors: {chat: [not_participant]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Чат не найден (errors: {chat: [chat_not_found]})'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Флуд-лимит 30 переключений/мин на пользователя (errors: {enabled: [flood_limit]})'
          headers:
            Retry-After:
              description: Секунды до доступного токена
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <accessToken>'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9]([a-zA-Z0-9_.-]{1,30}[a-zA-Z0-9])$'
          description: Буквенно-цифровые границы; уникальность регистронезависимая (по lower())
        email:
          type: string
          format: email
          maxLength: 254
    ResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ConfirmRegistrationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Одноразовый токен email_verification (256-bit, base64url)
    SetPasswordRequest:
      type: object
      additionalProperties: false
      required: [setupToken, password, confirmPassword]
      properties:
        setupToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Одноразовый токен password_setup (256-bit, base64url)
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 'Политика FR-004: 8–128 символов; не пустой/пробельный; вне топ-листа тривиальных; ≠ username/email'
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          description: username ИЛИ email
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Без политики на входе — любой неверный пароль даёт единый 401; потолок 128 — DoS-защита
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Opaque refresh-токен (256-bit, base64url)
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Opaque refresh-токен (256-bit, base64url)
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password, confirmPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Одноразовый токен password_reset (256-bit, base64url)
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 'Политика FR-004: 8–128 символов; не пустой/пробельный; вне топ-листа тривиальных; ≠ username/email'
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128
    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresInSec]
      properties:
        accessToken:
          type: string
          format: jwt
          description: Короткоживущий access-токен, JWT ES256 (TTL 5 мин)
        refreshToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Opaque refresh-токен (256-bit, base64url, TTL 3 дня sliding); ротация при каждом использовании
        tokenType:
          type: string
          const: Bearer
        expiresInSec:
          type: integer
          minimum: 1
          description: TTL access-токена, секунды
    PublicUser:
      type: object
      additionalProperties: false
      required: [id, username, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9]([a-zA-Z0-9_.-]{1,30}[a-zA-Z0-9])$'
        email:
          type: string
          format: email
          maxLength: 254
        status:
          type: string
          enum: [pending_email_confirmation, awaiting_password, active]
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Профильное отображаемое имя (008a, FR-001): отсутствует → клиент отображает username (единая цепочка alias → displayName → username); задаётся/сбрасывается №39 (серверный trim, 1–64 символа после trim, Unicode без ограничений); чтение возвращает сохранённое значение; экранирование при рендере — клиентский инвариант 008 FR-033'
    UserWithAlias:
      type: object
      description: 'Пользователь с персональным alias вызывающего (008a, FR-003/FR-016): поля PublicUser + alias — для поверхностей, где alias вызывающего живёт внутри пользовательского объекта: GroupMember.user №28, результат поиска №19; в №11/№12/№13 peer остаётся PublicUser (displayName), alias передаётся отдельным полем peerAlias (аддитивность anyOf-контракта)'
      additionalProperties: false
      required: [id, username, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9]([a-zA-Z0-9_.-]{1,30}[a-zA-Z0-9])$'
        email:
          type: string
          format: email
          maxLength: 254
        status:
          type: string
          enum: [pending_email_confirmation, awaiting_password, active]
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Профильное отображаемое имя (008a, FR-001): отсутствует → клиент отображает username (единая цепочка alias → displayName → username); задаётся/сбрасывается №39 (серверный trim, 1–64 символа после trim, Unicode без ограничений); чтение возвращает сохранённое значение; экранирование при рендере — клиентский инвариант 008 FR-033'
        alias:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Персональный alias вызывающего к этому пользователю (008a, FR-003): виден только вызывающему — сам пользователь и третьи лица поле не получают; отсутствует = не задан или пользователь не контакт вызывающего → отображение по displayName/username; задаётся/сбрасывается №40 (серверный trim, 1–64 символа после trim); alias переживает удаление чата и удаляется вместе с контактом (№22)'
    Problem:
      type: object
      description: 'RFC 9457: единая модель ошибок; расширения допускаются'
      required: [title, status]
      properties:
        type:
          type: string
          description: URI-reference на тип ошибки (опционально)
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          description: Коды ошибок валидации по полям (в 400-ответах)
          additionalProperties:
            type: array
            items:
              type: string
              description: Код ошибки, например invalid_format
    SsoProvider:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          description: Стабильный код провайдера из конфигурации
        displayName:
          type: string
          description: Отображаемое имя для кнопки входа
    SsoProvidersResponse:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          description: Включённые провайдеры в порядке конфигурации; пуст при ненастроенном SSO
          items:
            $ref: '#/components/schemas/SsoProvider'
    SsoAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [providerId]
      properties:
        providerId:
          type: string
          description: Код провайдера из GET /auth/sso/providers
        returnTo:
          type: string
          maxLength: 512
          description: 'Опциональный путь возврата внутри SPA (например /chat); только относительный путь — не-относительный или длиннее 512 символов → 400 invalid_format'
    SsoLinkAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [providerId]
      properties:
        providerId:
          type: string
          description: Код провайдера для привязки к текущему пользователю
    SsoAuthorizeResponse:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: 'URL авторизации IdP: содержит state, nonce, PKCE code_challenge (S256); redirect_uri = {public-base-url}/api/v1/auth/sso/callback. Verifier клиенту не виден (server-side confidential client); клиент обязан выполнить браузерный переход'
    SsoTokenRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Одноразовый handshake-код из callback (TTL 2 мин)
    Identity:
      type: object
      additionalProperties: false
      required: [id, providerId, email, linkedAt]
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
        providerDisplayName:
          type: [string, 'null']
          description: Отображаемое имя провайдера из конфигурации; null, если провайдер удалён из конфига
        email:
          type: [string, 'null']
          description: Email от провайдера (последний известный)
        linkedAt:
          type: string
          format: date-time
    IdentitiesResponse:
      type: object
      additionalProperties: false
      required: [identities]
      properties:
        identities:
          type: array
          description: Привязки пользователя, упорядоченные по linkedAt
          items:
            $ref: '#/components/schemas/Identity'
    EnsureChatRequest:
      type: object
      additionalProperties: false
      required: [peerUserId]
      properties:
        peerUserId:
          type: string
          format: uuid
          description: Собеседник; диалог с самим собой → 422 self_forbidden
    ChatView:
      type: object
      description: 'Чат вызывающего: direct-вариант (004) или group-вариант (006) — type-дискриминация; group-поля присутствуют только при type=group, peer-поля у group-варианта — null'
      additionalProperties: false
      required: [chatId, peer, blockedByMe, peerReadUpToSeq, myReadUpToSeq]
      properties:
        chatId:
          type: string
          format: uuid
          description: Идентификатор чата (диалога пары или группы)
        type:
          type: string
          enum: [direct, group]
          description: 'Тип чата (006): direct-ответ может не нести поле (backward-friendly) или несёт direct; group — групповой вариант ответа'
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: Название группы (только type=group)
        description:
          type: [string, 'null']
          maxLength: 256
          description: Описание группы (только type=group); null — описание не задано
        myRole:
          type: string
          enum: [owner, admin, member]
          description: Роль вызывающего в группе (только type=group)
        othersReadUpToSeq:
          type: integer
          format: int64
          minimum: 0
          description: 'MAX(last_read_seq) активных участников группы, кроме вызывающего (только type=group, 006): ✓✓ собственных сообщений при прочтении хотя бы одним участником; 0 в группе из одного — ✓✓ не выставляется; монотонно, не сбрасывается новыми участниками (FR-012); вышедшие/исключённые выпадают из условия'
        memberCount:
          type: integer
          minimum: 1
          maximum: 200
          description: Активный состав группы, включая владельца (только type=group)
        peer:
          anyOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
          description: Собеседник (вторая сторона диалога; direct) с профильным displayName (008a; отсутствует → username); null у group-варианта (006)
        peerAlias:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Персональный alias вызывающего к собеседнику (008a, FR-003; peer-фрагмент №11): виден только вызывающему; отсутствует = не задан или peer не контакт вызывающего → отображение по displayName/username (цепочка alias → displayName → username); задаётся/сбрасывается №40 (серверный trim, 1–64 символа после trim); null/отсутствует у group-варианта'
        blockedByMe:
          type: [boolean, 'null']
          description: 'Вызывающий блокирует собеседника (FR-020). Единственная проекция блокировок в API: поле «кто заблокировал меня» отсутствует — заблокированный узнаёт о блокировке только из 403 you_are_blocked при отправке. Null у group-варианта (006): блокировки на группы не действуют'
        peerReadUpToSeq:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Водяной знак прочтения собеседника (0 — ничего не прочитано); для двойной галочки отправителя. Null у group-варианта (006) — заменяется othersReadUpToSeq
        myReadUpToSeq:
          type: integer
          format: int64
          minimum: 0
          description: Водяной знак прочтения вызывающего (0 — ничего не прочитано)
        soundEnabled:
          type: boolean
          description: 'Персональный переключатель звуковых оповещений чата вызывающего (008a, FR-012): chat_participants.sound_enabled; сервер выставляет всегда (умолчание для новых участий — true); отсутствие поля (старый сервер) клиент трактует как true; смена — №42 + событие chat.sound.updated только в собственный канал вызывающего; значение и факт настройки другим участникам не раскрываются'
    Message:
      type: object
      additionalProperties: false
      required: [id, chatId, senderId, text, seq, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: '= clientMessageId из №16: клиентский UUID, exactly-once дедупликация (FR-004)'
        chatId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
          description: Отправитель (участник диалога)
        text:
          type: string
          maxLength: 4096
          description: Триммированный по краям текст (FR-003); внутренние пробелы сохраняются; ≤4096 символов после trim
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Монотонный порядок внутри диалога (уникален в рамках чата); основа курсорной пагинации №15
        createdAt:
          type: string
          format: date-time
    ChatListItem:
      type: object
      description: 'Элемент единого списка «Чаты» (№12, 006): direct-диалог или группа — type-дискриминация; group-поля присутствуют только при type=group, peer-поля у group-элемента — null'
      additionalProperties: false
      required: [chatId, peer, lastMessage, unreadCount, blockedByMe]
      properties:
        chatId:
          type: string
          format: uuid
        type:
          type: string
          enum: [direct, group]
          description: 'Тип чата (006): direct-элементы могут не нести поле (backward-friendly) или несут direct; group — групповой элемент единого списка (FR-014)'
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: Название группы (только type=group)
        memberCount:
          type: integer
          minimum: 1
          maximum: 200
          description: Активный состав группы, включая владельца (только type=group)
        myRole:
          type: string
          enum: [owner, admin, member]
          description: Роль вызывающего в группе (только type=group)
        peer:
          anyOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
          description: Собеседник (direct) с профильным displayName (008a; отсутствует → username); null у group-элемента (006)
        peerAlias:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Персональный alias вызывающего к собеседнику (008a, FR-003; peer-фрагмент №12): виден только вызывающему; отсутствует = не задан или peer не контакт вызывающего → отображение по displayName/username (цепочка alias → displayName → username); задаётся/сбрасывается №40 (серверный trim, 1–64 символа после trim); null/отсутствует у group-элемента'
        lastMessage:
          description: Последнее видимое вызывающему сообщение (входящее или исходящее); null — видимых сообщений нет (пустой или полностью удалённый у себя диалог)
          anyOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        unreadCount:
          type: integer
          format: int64
          minimum: 0
          description: Серверно-авторитарный счётчик, ограничен позицией доставки — входящие видимые сообщения с GREATEST(last_read_seq, deleted_up_to_seq) < seq ≤ LEAST(last_seq, delivered_up_to_seq); realtime и дозагруженные синхронизацией сообщения увеличивают его одинаково (после ack доставки №25); ниже точки обрезки — недоступные, не непрочитанные (FR-007); при блокировке у блокирующего «замирает» (FR-020); «99+» — клиентский рендер, внутренний счёт точный
        blockedByMe:
          type: [boolean, 'null']
          description: 'Вызывающий блокирует собеседника — метка «заблокирован» в UI (FR-020). Null у group-элемента (006): блокировки на группы не действуют'
        soundEnabled:
          type: boolean
          description: 'Персональный переключатель звуковых оповещений чата вызывающего (008a, FR-012): chat_participants.sound_enabled; сервер выставляет всегда (умолчание для новых участий — true); отсутствие поля (старый сервер) клиент трактует как true; смена — №42 + событие chat.sound.updated только в собственный канал вызывающего; значение и факт настройки другим участникам не раскрываются'
    MessagePage:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          description: 'Страница истории — по seq DESC (новее — раньше) в режиме before/без курсора: ровно те, что seq < before; по seq ASC в режиме after: ровно те, что seq > after; пустая страница на границе — корректный ответ'
          maxItems: 50
          items:
            $ref: '#/components/schemas/Message'
        nextBefore:
          type: integer
          format: int64
          minimum: 1
          description: 'Курсор следующей страницы: seq самой старой записи этой страницы; отсутствует, когда старее нет (история исчерпана)'
        nextAfter:
          type: integer
          format: int64
          minimum: 1
          description: 'Курсор следующей ascending-страницы (только режим after): seq последней записи этой страницы; отсутствует, когда новее нет (история вперёд исчерпана); в DESC-режиме не возвращается'
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, text]
      properties:
        clientMessageId:
          type: string
          format: uuid
          description: Клиентский UUID сообщения; ретраи тем же id → 200 существующей записи (exactly-once, FR-004); принадлежность другой записи → 409
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: 'FR-003: trim начальных/конечных пробелов, непустой после trim (иначе 400 text_blank), ≤4096 символов после trim (иначе 400 text_too_long); внутренние пробелы сохраняются'
    ReadRequest:
      type: object
      additionalProperties: false
      required: [upToSeq]
      properties:
        upToSeq:
          type: integer
          format: int64
          minimum: 1
          description: Прочитано до seq включительно; 1 ≤ upToSeq ≤ seq последнего сообщения диалога (иначе 400 invalid_up_to_seq); идемпотентно и монотонно
    MessageCreatedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 message.created: новое сообщение записано и закоммичено (FR-007); публикуется обоим участникам — получателю для отображения, отправителю для остальных его устройств/сессий'
      required: [chatId, message]
      properties:
        chatId:
          type: string
          format: uuid
          description: Диалог события
        message:
          $ref: '#/components/schemas/Message'
          description: Та же схема, что в №16/№15; клиент дедуплицирует по message.id
    ChatReadEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 chat.read: собеседник просмотрел сообщения диалога до readUpToSeq включительно (FR-010); монотонно — публикуется только при продвижении водяного знака; при блокировке не публикуется ни в канал блокирующего, ни в канал заблокированного (FR-020)'
      required: [chatId, readUpToSeq, byUserId]
      properties:
        chatId:
          type: string
          format: uuid
          description: Диалог
        readUpToSeq:
          type: integer
          format: int64
          minimum: 1
          description: Новый водяной знак читавшего
        byUserId:
          type: string
          format: uuid
          description: Кто прочитал
    ContactView:
      type: object
      additionalProperties: false
      required: [user, createdAt, blockedByMe]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
          description: Пользователь из списка контактов вызывающего
        createdAt:
          type: string
          format: date-time
          description: Когда пользователь добавлен в контакты вызывающего
        blockedByMe:
          type: boolean
          description: 'Собственная блокировка вызывающим этого контакта (008/T097): та же проекция, что blockedByMe №12/№13, но живёт и без чата — блокировка контакта с удалённым (скрытым) диалогом остаётся видимой после F5; поле «кто заблокировал меня» отсутствует (FR-020); контакты и блокировки независимы (FR-017/FR-020) — поле не меняет ни одну операцию'
        alias:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Персональный alias вызывающего к контакту (008a, FR-003): виден только вызывающему; отсутствует = не задан → отображение по displayName/username (цепочка alias → displayName → username); задаётся/сбрасывается №40 (серверный trim, 1–64 символа после trim, null = сброс); удаляется вместе с контактом (№22), переживает удаление чата; сортировка/фильтр списка — клиентские по цепочке имён'
    ContactsResponse:
      type: object
      additionalProperties: false
      required: [contacts]
      properties:
        contacts:
          type: array
          description: 'Контакты вызывающего: серверная алфавитная сортировка по выбранному полю без учёта регистра — lower(username) при sort=login, lower(email) при sort=email (FR-015); пустой список валиден'
          items:
            $ref: '#/components/schemas/ContactView'
    UsersSearchResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          maxItems: 1
          description: 'Точное совпадение полного email ИЛИ полного логина без учёта регистра (FR-016): 0..1 элемент; пустой список — корректный ответ (совпадения нет); с 008a найденный несёт displayName (если задан) и alias вызывающего (если найденный — его контакт)'
          items:
            $ref: '#/components/schemas/UserWithAlias'
    DeliveryAckItem:
      type: object
      description: 'Элемент батча №25: подтверждение доставки по одному чату (chatId + upToSeq)'
      additionalProperties: false
      required: [chatId, upToSeq]
      properties:
        chatId:
          type: string
          format: uuid
          description: Диалог, по которому подтверждается доставка; членство проверяется по каждому элементу (чужой → 403, несуществующий → 404 — весь батч отклоняется)
        upToSeq:
          type: integer
          format: int64
          minimum: 1
          description: Доставлено до seq включительно; 1 ≤ upToSeq ≤ seq последнего сообщения чата (иначе 400 invalid_up_to_seq); применяется монотонно (GREATEST) — повтор/меньшее без эффекта
    DeliveryAckRequest:
      type: object
      description: 'Тело №25: батч подтверждений доставки (1–100 элементов), атомарен'
      additionalProperties: false
      required: [acks]
      properties:
        acks:
          type: array
          minItems: 1
          maxItems: 100
          description: Батч подтверждений доставки (1–100 элементов); атомарен — одна транзакция, отказ любого элемента отклоняет весь батч без частичных эффектов
          items:
            $ref: '#/components/schemas/DeliveryAckItem'
    SyncCursor:
      type: object
      description: 'Клиентский курсор одного чата для №26: seq последнего подтверждённо полученного сообщения'
      additionalProperties: false
      required: [chatId, upToSeq]
      properties:
        chatId:
          type: string
          format: uuid
          description: Диалог курсора; чужие/несуществующие chatId молча игнорируются (per-user операция не падает из-за посторонних идентификаторов)
        upToSeq:
          type: integer
          format: int64
          minimum: 0
          description: Локальный курсор клиента — seq последнего подтверждённо полученного сообщения; применяется сервером как нижняя граница своей позиции (эффективный курсор = max(клиентский, серверный)); «будущий» курсор ремонтируется per-chat (desynced + serverUpToSeq) без ошибки запроса
    SyncRequest:
      type: object
      description: 'Тело №26: карта клиентских курсоров + лимиты страницы (chatLimit/messageLimit)'
      additionalProperties: false
      required: [cursors]
      properties:
        cursors:
          type: array
          description: Карта клиентских курсоров по чатам (per-chat карта в теле POST); дубликаты chatId не допускаются семантически — курсор один на чат
          items:
            $ref: '#/components/schemas/SyncCursor'
        chatLimit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: Максимум чатов (дельт) в ответе — 1–50, по умолчанию 20; вне диапазона → 400 limit_out_of_range
        messageLimit:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
          description: Максимум сообщений в дельте чата — 1–50, по умолчанию 50 (фиксированная константа фичи); вне диапазона → 400 limit_out_of_range
    SyncChatDelta:
      type: object
      description: 'Дельта одного чата в №26: курсор возобновления, страница сообщений и серверные счётчики — вычислены в одном снимке чтения; с 006 — дельта direct-чата или группы (type-дискриминация; myRole в дельте не передаётся — сходится через №12/№28)'
      additionalProperties: false
      required: [chatId, peer, blockedByMe, startAfterSeq, messages, hasMore, peerReadUpToSeq, unreadCount, lastSeq]
      properties:
        chatId:
          type: string
          format: uuid
          description: Чат дельты
        type:
          type: string
          enum: [direct, group]
          description: 'Тип чата (006): direct-дельта может не нести поле (backward-friendly); group-дельта несёт title/memberCount/othersReadUpToSeq, peer-поля — null; отбираются только active-членства вызывающего (исключённому дельты группы не приходят)'
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: Название группы (только type=group)
        memberCount:
          type: integer
          minimum: 1
          maximum: 200
          description: Активный состав группы, включая владельца (только type=group)
        othersReadUpToSeq:
          type: integer
          format: int64
          minimum: 0
          description: 'MAX(last_read_seq) активных участников группы, кроме вызывающего (только type=group, 006): накопленные оффлайн ✓✓ собственных сообщений (достаточно прочтения одного участника); монотонно (FR-012)'
        peer:
          anyOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
          description: Собеседник (как №12; direct); null у group-дельты (006)
        blockedByMe:
          type: [boolean, 'null']
          description: 'Вызывающий блокирует собеседника — единственная проекция блокировок в API (004, без изменений); null у group-дельты (006): блокировки на группы не действуют'
        startAfterSeq:
          type: integer
          format: int64
          minimum: 0
          description: Эффективный курсор возобновления (после обрезки/ремонта) — клиент продвигает локальный курсор до него до применения сообщений
        truncatedUpToSeq:
          type: integer
          format: int64
          minimum: 1
          description: 'Точка обрезки (курсор ниже нижней границы видимости: per-user удаление 004, возврат чата новым входящим, окно активной истории): сообщения ниже не возвращаются и недоступны (не непрочитаны); присутствует только при обрезке; позиция доставки и курсор закрепляются на ней ack''ом (№25)'
        messages:
          type: array
          maxItems: 50
          description: Дельта сообщений по seq ASC (строго новее startAfterSeq), ≤ messageLimit; только видимые вызывающему (seq > deleted_up_to_seq), включая исходящие пользователя; дедупликация на клиенте — по message.id
          items:
            $ref: '#/components/schemas/Message'
        hasMore:
          type: boolean
          description: В чате остались недоставленные сообщения сверх страницы — продолжение цикла B (№15 after) до исчерпания nextAfter
        peerReadUpToSeq:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Водяной знак прочтения собеседника — накопленные оффлайн ✓✓ собственных сообщений вызывающего (0 — ничего не прочитано). Null у group-дельты (006) — заменяется othersReadUpToSeq
        unreadCount:
          type: integer
          format: int64
          minimum: 0
          description: 'Серверный счётчик непрочитанных: COUNT(входящих, seq > GREATEST(last_read_seq, deleted_up_to_seq), seq ≤ LEAST(last_seq, delivered_up_to_seq)); сообщения текущей страницы не входят до ack''а доставки — клиент учитывает отображённое оптимистично и сходится к серверному значению'
        lastSeq:
          type: integer
          format: int64
          minimum: 0
          description: Текущий chats.last_seq — детект хвоста клиентом
        desynced:
          type: boolean
          description: '«Курсор из будущего»: клиентский upToSeq противоречит серверным данным (например, восстановление из резервной копии); присутствует только при ремонте — всему запросу ошибки нет, остальные чаты обрабатываются штатно; сервер свою позицию доставки не откатывает'
        serverUpToSeq:
          type: integer
          format: int64
          minimum: 0
          description: 'Фактическая серверная позиция доставки чата (возвращается с desynced: true) — клиент отматывает локальный курсор на неё и продолжает штатно'
    SyncResponse:
      type: object
      description: 'Ответ №26: дельты чатов с недоставленным + признак оставшихся чатов'
      additionalProperties: false
      required: [chats, moreChats]
      properties:
        chats:
          type: array
          description: Дельты только чатов с недоставленным, по последней активности DESC (первыми — чаты с самыми новыми сообщениями), до chatLimit; пустой список — доставлено всё (корректный ответ)
          items:
            $ref: '#/components/schemas/SyncChatDelta'
        moreChats:
          type: boolean
          description: Недоставленные чаты остались за пределами chatLimit — повтор №26 с обновлёнными курсорами (вычислено в том же снимке чтения)
    CreateGroupRequest:
      type: object
      description: 'Тело №27: создание группы; начальный состав — из контактов создателя, весь запрос атомарен'
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Название группы (FR-001): trim начальных/конечных пробелов, 1–64 символов после trim (иначе 400 invalid_title)'
        description:
          type: string
          maxLength: 256
          description: 'Описание (опционально): ≤256 символов (иначе 400 invalid_description)'
        memberUserIds:
          type: array
          maxItems: 199
          uniqueItems: true
          description: 'Начальный состав из контактов создателя (добавленные получают роль member); не-uuid/дубли → 400 invalid_member_ids; сам создатель в списке → 400 self_forbidden; кто-то не в контактах создателя → 422 not_in_contacts (весь запрос отклонён, группа не создаётся); вместимость (состав + создатель > 200) → 409 group_full'
          items:
            type: string
            format: uuid
    UpdateGroupRequest:
      type: object
      description: 'Тело №29: изменение метаданных группы (owner/admin); хотя бы одно поле — иначе 400 empty_patch; применяется атомарно целиком'
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Новое название (валидация как №27: trim, 1–64 символов после trim — иначе 400 invalid_title)'
        description:
          type: string
          maxLength: 256
          description: 'Новое описание (≤256 символов — иначе 400 invalid_description)'
    AddMembersRequest:
      type: object
      description: 'Тело №31: batch добавления участников из контактов ДОБАВЛЯЮЩЕГО (owner/admin); атомарен — невалидность любого элемента отклоняет весь batch'
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 199
          uniqueItems: true
          description: 'Добавляемые (роль member): не-uuid/дубли → 400 invalid_user_ids; сам добавляющий → 400 self_forbidden; не-контакт добавляющего → 422 not_in_contacts (весь batch отклонён); активные + batch > 200 → 409 group_full; уже активные — идемпотентно игнорируются'
          items:
            type: string
            format: uuid
    SetMemberRoleRequest:
      type: object
      description: 'Тело №34: назначение (admin) или снятие (member) роли администратора — только owner'
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
          description: 'Новая роль active-участника; owner этой операцией не назначается (передача владения — №35); иное значение → 400 invalid_role'
    TransferOwnershipRequest:
      type: object
      description: 'Тело №35: передача владения — только owner; цель — active-участник, не сам owner'
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: 'Новый владелец (active-участник): сам owner → 400 self_forbidden; не active-участник → 409 target_not_member'
    GroupMember:
      type: object
      description: 'Участник группы с ролью (элемент состава GroupView и ответов №31/№34)'
      additionalProperties: false
      required: [user, role, joinedAt]
      properties:
        user:
          $ref: '#/components/schemas/UserWithAlias'
          description: Участник группы с профильным displayName и персональным alias вызывающего к нему (008a, FR-003)
        role:
          type: string
          enum: [owner, admin, member]
          description: 'Роль в группе (FR-003): owner — ровно один (частичный уникальный индекс), admin — назначается/снимается owner (№34), member — базовая роль'
        joinedAt:
          type: string
          format: date-time
          description: Момент первого добавления участника в группу
    GroupView:
      type: object
      description: 'Группа (№27/№28/№29/№35): метаданные + активный состав с ролями; chatId = groupId событий и chatId путей №12–№17/№26'
      additionalProperties: false
      required: [chatId, title, description, myRole, members]
      properties:
        chatId:
          type: string
          format: uuid
          description: Идентификатор группы (id строки chats — единый ключ №12–№17/№26 и groupId событий)
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: Название группы (FR-001)
        description:
          type: [string, 'null']
          maxLength: 256
          description: Описание группы; null — описание не задано
        myRole:
          type: string
          enum: [owner, admin, member]
          description: Роль вызывающего в группе
        members:
          type: array
          maxItems: 200
          description: Активный состав с ролями (лимит участников — 200, включая владельца); только активные членства (state=active)
          items:
            $ref: '#/components/schemas/GroupMember'
    GroupUpdatedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 group.updated: метаданные группы изменены (FR-007); всем активным участникам; клиент обновляет название в «Чатах» и заголовке без перезагрузки; обработка идемпотентна (состояние, не дельты — FR-015)'
      required: [groupId, title, description, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          description: Группа (= chatId)
        title:
          type: string
          description: Новое название
        description:
          type: [string, 'null']
          description: Новое описание; null — не задано
        actorId:
          type: string
          format: uuid
          description: Кто изменил (owner/admin)
    GroupMemberAddedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 group.member.added: состав вырос (FR-002); всем активным участникам, включая добавленного — группа сразу видна в его «Чатах»; водяной знак добавленного инициализирован позицией группы (бейдж с 0, FR-013); обработка идемпотентна — дубль кадра не создаёт дубль группы (FR-015)'
      required: [groupId, user, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          description: Группа (= chatId)
        user:
          $ref: '#/components/schemas/PublicUser'
          description: Добавленный участник (роль — member)
        actorId:
          type: string
          format: uuid
          description: Кто добавил
    GroupMemberRemovedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 group.member.removed: состав уменьшился (исключение №32 или выход №33); всем оставшимся активным участникам — сам удалённый получает group.you_removed'
      required: [groupId, userId, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          description: Группа (= chatId)
        userId:
          type: string
          format: uuid
          description: Исключённый/вышедший участник
        actorId:
          type: [string, 'null']
          format: uuid
          description: Кто исключил; null при самостоятельном выходе (№33)
    GroupRoleChangedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 group.role.changed: роль изменена (FR-003); всем активным участникам; передача владения (№35) — два кадра парой: новый owner и прежний → admin; обработка идемпотентна (состояние, не дельты — FR-015)'
      required: [groupId, userId, role, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          description: Группа (= chatId)
        userId:
          type: string
          format: uuid
          description: Чья роль изменилась
        role:
          type: string
          enum: [owner, admin, member]
          description: Новая роль
        actorId:
          type: string
          format: uuid
          description: Кто изменил (owner)
    GroupDeletedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 group.deleted: группа удалена владельцем — hard-delete (FR-006); всем бывшим активным участникам (снимок состава до удаления); клиент убирает группу из «Чатов», закрывает окна и игнорирует последующие события группы'
      required: [groupId, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          description: Группа (= chatId)
        actorId:
          type: string
          format: uuid
          description: Владелец, выполнивший удаление
    GroupYouRemovedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 group.you_removed: финальное событие группы для исключённого/вышедшего (FR-010/FR-015); адресуется только затронутому пользователю (все его устройства/сессии); после него события группы в канал не публикуются (окно ≤5 с); клиент обязан удалить группу из «Чатов», игнорировать последующие события этой группы (гонка порядка) и исключить её из отложенных ack-батчей №25'
      required: [groupId, reason]
      properties:
        groupId:
          type: string
          format: uuid
          description: Группа (= chatId)
        reason:
          type: string
          enum: [kicked, left]
          description: 'kicked — исключён владельцем/админом (№32); left — вышел самостоятельно (№33)'
    ConnectedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-кадр №18 connected (007): opening-фрейм — отправляется сервером сразу после retry: 3000; connectionId — идентификатор регистрации подключения, используется клиентом в heartbeat №37; живёт вместе с потоком: реконнект выдаёт новый connectionId, старая регистрация самоистекает по TTL; клиенты, не знающие кадра, игнорируют неизвестный event: (контракт 004 §3 — кадр безопасен для всех действующих потребителей)'
      required: [connectionId]
      properties:
        connectionId:
          type: string
          format: uuid
          description: Идентификатор регистрации подключения (для presence-heartbeat №37)
    PresenceUpdatedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 presence.updated (007): смена опубликованного статуса субъекта; публикуется каждому члену аудитории видимости субъекта (общий чат ∪ «субъект в контактах наблюдающего» − блок-пары − сам субъект) один раз на переход независимо от числа общих чатов; режим «невидимки» замораживает исходящие события субъекта (FR-007); идемпотентность FR-003 — применять только строго большее rev per-user (дубль кадра, задержавшийся кадр — no-op)'
      required: [userId, status, rev]
      properties:
        userId:
          type: string
          format: uuid
          description: Субъект смены (не наблюдатель)
        status:
          type: string
          enum: [online, offline]
          description: 'Опубликованный статус: online — немедленно (дебаунс 0), offline — гистерезис-задержанный (окно 45 c)'
        rev:
          type: integer
          format: int64
          description: Монотонная ревизия статуса per-user; строгое возрастание — дубль/устаревший кадр игнорируется
        lastSeenAt:
          type: string
          format: date-time
          description: 'Время последней активности presence-канала субъекта (008a, FR-010/FR-011, SC-002): поле присутствует ТОЛЬКО при status=offline (при online поля нет) ∧ наблюдатель в аудитории видимости субъекта (007; событие уже адресуется аудитории) ∧ субъект НЕ в режиме «невидимки» (FREEZE публикует offline без lastSeenAt — целиком скрыт) ∧ данные есть. Во всех остальных случаях поле ОТСУТСТВУЕТ — нейтрально и неотличимо: «нет данных» ≡ «инкогнито» ≡ «блок-пара» ≡ «вне аудитории» (клиент рендерит «Был в сети — давно»). Точность значения — в пределах TTL-модели 007: штатное закрытие — точное, обрыв/TTL-истечение — ≤ регистрации 90 с + гистерезиса 45 с + poller 1 с (SC-005). Клиенты 007, не знающие поля, игнорируют его без изменения поведения'
    PresenceStatusItem:
      type: object
      additionalProperties: false
      description: 'Элемент №36: статус одной цели; online/offline — последний опубликованный статус (гистерезис-согласован с presence.updated: в окне pending-offline — online); unknown — «нет доступа» или несуществующий userId (не различает «офлайн» и «скрыто» — FR-007)'
      required: [userId, status, rev]
      properties:
        userId:
          type: string
          format: uuid
          description: Цель снапшота (запрошенный userId)
        status:
          type: string
          enum: [online, offline, unknown]
          description: 'online — ≥1 живой регистрации и не «невидимка»; offline — опубликованный офлайн, в т.ч. режим «невидимки» (неотличимо); unknown — вызывающий вне аудитории видимости, блок-пара или несуществующий userId'
        rev:
          type: integer
          format: int64
          description: Ревизия статуса цели; слияние с событиями №18 по max(rev) per-user (идемпотентность FR-003)
        lastSeenAt:
          type: string
          format: date-time
          description: 'Время последней активности presence-канала цели (008a, FR-010/FR-011, SC-002): поле присутствует ТОЛЬКО при status=offline ∧ вызывающий в аудитории видимости цели (007) ∧ цель НЕ в режиме «невидимки» (неотличимо от offline без поля) ∧ данные есть (был онлайн после развёртывания фичи). Во всех остальных случаях поле ОТСУТСТВУЕТ — нейтрально и неотличимо: «нет данных» ≡ «инкогнито» ≡ «блок-пара» ≡ «вне аудитории» (клиент рендерит «Был в сети — давно»). Точность значения — в пределах TTL-модели 007: штатное закрытие — точное, обрыв/TTL-истечение — ≤ регистрации 90 с + гистерезиса 45 с + poller 1 с (SC-005); ретроспективы до развёртывания фичи нет'
    PresenceSnapshotResponse:
      type: object
      additionalProperties: false
      description: 'Ответ №36: статусы запрошенных целей отображаемых поверхностей'
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          description: По одному элементу на каждый запрошенный userId (после дедупа)
          items:
            $ref: '#/components/schemas/PresenceStatusItem'
    PresenceHeartbeatRequest:
      type: object
      additionalProperties: false
      description: 'Тело №37: идентификатор регистрации подключения из opening-фрейма connected канала №18'
      required: [connectionId]
      properties:
        connectionId:
          type: string
          format: uuid
          description: connectionId из фрейма connected; реконнект выдаёт новый, старая регистрация самоистекает по TTL
    PresenceSettingsResponse:
      type: object
      additionalProperties: false
      description: 'Ответ №38: значение режима «невидимки» (≡ колонка users.presence_hidden)'
      required: [incognito]
      properties:
        incognito:
          type: boolean
          description: 'true — режим «невидимки»: субъект виден окружающим как «офлайн» (неотличимо), исходящие события заморожены'
    PresenceSettingsUpdateRequest:
      type: object
      additionalProperties: false
      description: 'Тело №38 PUT: новое значение режима «невидимки»; идемпотентно — повтор той же величины no-op без событий'
      required: [incognito]
      properties:
        incognito:
          type: boolean
          description: 'Новое значение режима; не boolean → 400 malformed_request'
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      description: 'Тело №39 PUT: обновление профиля вызывающего; displayName null/отсутствие = сброс (имя не задано); realtime-события смены имени нет — рефетч-семантика'
      properties:
        displayName:
          type: [string, 'null']
          description: 'Профильное отображаемое имя; серверный trim, допустимая длина 1–64 символа после trim, Unicode без ограничений; пусто/пробельно или длиннее 64 после trim → 400 invalid_display_name; null/отсутствие = сброс к отображению по username'
    AliasUpdateRequest:
      type: object
      additionalProperties: false
      description: 'Тело №40 PUT: персональный alias контакта (виден только вызывающему); alias null/отсутствие = сброс → отображение по displayName/username; идемпотентность — последний write wins'
      properties:
        alias:
          type: [string, 'null']
          description: 'Персональный alias вызывающего к контакту; серверный trim, допустимая длина 1–64 символа после trim, Unicode без ограничений; пусто/пробельно или длиннее 64 после trim → 400 invalid_alias; null/отсутствие = сброс; удаляется вместе с контактом (№22), переживает удаление чата'
    TypingRequest:
      type: object
      additionalProperties: false
      description: 'Тело №41 POST: эфемерный сигнал набора текста; состояние не читается и не реплеится (подключившимся не восстанавливается); повтор start = продление'
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop]
          description: 'start — начало/продление набора (публикация typing.started участникам чата кроме отправителя); stop — завершение (typing.stopped только при активном состоянии — идемпотентность против двойного погашения); значение вне enum или отсутствие → 400 invalid_action'
    ChatSoundRequest:
      type: object
      additionalProperties: false
      description: 'Тело №42 PUT: персональный (per-user-per-chat) переключатель звуковых оповещений; значение и факт настройки другим участникам не раскрываются'
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 'Новое значение звуковых оповещений чата для вызывающего; не boolean или отсутствие → 400 malformed_request; смена значения → событие chat.sound.updated только в собственный канал №18, повтор того же значения — 200 без события'
    ChatSoundResponse:
      type: object
      additionalProperties: false
      description: 'Ответ №42: сохранённое персональное значение звуковых оповещений чата'
      required: [soundEnabled]
      properties:
        soundEnabled:
          type: boolean
          description: Сохранённое значение вызывающего для чата (умолчание для новых участий — true)
    TypingStartedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 typing.started (008a, FR-006/FR-007): участник userId начал/продолжает набор текста в чате chatId; публикуется всем активным участникам чата КРОМЕ отправителя сигнала (own-устройства свой набор не отображают) при каждом валидном start №41, включая продления (окно повтора клиента 3 с — «индикатор не отвисает»); дребезг исключён клиентским дебаунсом и флуд-лимитом 60/мин; DIRECT-блок-пара — не публикуется ни в одну сторону (сигнал при этом принимается 204). Эфемерность: состояние не сохраняется (0 следов в истории/sync) и не реплеится при (пере)подключении; операции чтения состояния набора нет. Клиент отображает «{имя} печатает…» (имя — цепочка alias → displayName → username) ≤ 2 с (SC-001) и скрывает по typing.stopped, message.created от печатающего или страховочному таймауту 10 с (компенсация at-most-once); серверное состояние самоистекает TTL 8 с; клиенты, не знающие события, игнорируют его (контракт 004)'
      required: [chatId, userId]
      properties:
        chatId:
          type: string
          format: uuid
          description: Чат, в котором идёт набор
        userId:
          type: string
          format: uuid
          description: Печатающий (отправитель сигнала, не наблюдатель)
    TypingStoppedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 typing.stopped (008a, FR-007): участник userId прекратил набор в чате chatId; схема идентична TypingStartedEvent; публикуется той же аудитории (активные участники чата кроме отправителя) в трёх случаях: (1) валидный stop №41 при активном состоянии — повторный stop без активного состояния не публикуется (идемпотентность против двойного погашения, в т.ч. клиентский stop при отклонённой валидацией пустой отправке); (2) успешная отправка сообщения №16 печатающим (сервер гасит состояние при INSERT); (3) серверное истечение состояния по TTL 8 с (poller, тик 1 с — обрыв сети/падение клиента; событие ≤ TTL + poll-interval, SC-003). DIRECT-блок-пара — не публикуется; эфемерность — как у typing.started; клиенты, не знающие события, игнорируют его'
      required: [chatId, userId]
      properties:
        chatId:
          type: string
          format: uuid
          description: Чат, в котором шёл набор
        userId:
          type: string
          format: uuid
          description: Прекративший набор (отправитель сигнала, не наблюдатель)
    ChatSoundUpdatedEvent:
      type: object
      additionalProperties: false
      description: 'SSE-событие №18 chat.sound.updated (008a, FR-012/FR-015): персональный переключатель звуковых оповещений чата изменён; публикуется ТОЛЬКО в собственный канал пользователя (rt:user:{me} — синхронизация мультидевайс ≤ 2 с, SC-006); другие участники чата событие не получают никогда — значение и факт настройки не раскрываются. Публикуется при успешной СМЕНЕ значения №42; повтор того же значения — 200 без события (идемпотентность); подключающиеся/переподключающиеся клиенты получают актуальное состояние из №12/№13 (soundEnabled), событие — только для живых подключений; клиенты, не знающие события, игнорируют его'
      required: [chatId, soundEnabled]
      properties:
        chatId:
          type: string
          format: uuid
          description: Чат настройки
        soundEnabled:
          type: boolean
          description: Новое значение звуковых оповещений вызывающего в этом чате
