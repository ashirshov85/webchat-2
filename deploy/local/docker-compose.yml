# Local development infrastructure for feature 002 (quickstart.md §2):
#   PostgreSQL 17 :5432, Redis 7 :6379, Mailpit :8025 (UI) / :1025 (SMTP),
#   SonarQube LTS :9000 (static analysis) + dedicated PostgreSQL for it
#   + dex IdP :5556 behind the `sso` profile (003-sso quickstart, T042)
#   + LiveKit SFU :7880 (009-video-conferences quickstart §2, T003)
# Usage: docker compose -f deploy/local/docker-compose.yml up -d
#        docker compose -f deploy/local/docker-compose.yml --profile sso up -d
# SonarQube on Linux requires: sudo sysctl -w vm.max_map_count=524288

services:
  postgres:
    image: postgres:17
    container_name: webchat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webchat}
      POSTGRES_USER: ${POSTGRES_USER:-webchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webchat}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-webchat} -d $${POSTGRES_DB:-webchat}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: webchat-redis
    # Ephemeral store (rate-limit buckets, failure counters, sid denylist) — no persistence (research.md §2)
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: webchat-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sonar-postgres:
    image: postgres:17
    container_name: webchat-sonar-postgres
    environment:
      POSTGRES_DB: ${SONAR_DB:-sonar}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sonar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: webchat-sonarqube
    depends_on:
      sonar-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/${SONAR_DB:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "9000:9000" # Web UI + scanner API
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/system/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # LiveKit media server for video conferences (009-video-conferences,
  # contracts/livekit-integration.md §1, research.md §11). Single node `--dev`
  # (no Redis), placeholder API pair devkey/secret — backend env of quickstart §2:
  # LIVEKIT_URL=http://localhost:7880, LIVEKIT_API_KEY=devkey, LIVEKIT_API_SECRET=secret.
  # `enable_remote_unmute` is required for server-side MutePublishedTrack (FR-008);
  # webhooks are signed with `devkey` and delivered to the backend running on the
  # host (`backend` resolves to the docker host via host-gateway).
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: webchat-livekit
    # --dev: single node, debug logging; full config via LIVEKIT_CONFIG env
    # (supported alternative to a mounted config file, container-friendly)
    command: ["--dev"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        keys:
          devkey: secret
        webhook:
          api_key: devkey
          urls:
            - http://backend:8080/api/internal/conferences/livekit/webhook
        room:
          enable_remote_unmute: true
        rtc:
          tcp_port: 7881
          # scalar mux port: the {start,end} map form is silently ignored by
          # livekit-server v1.13 and it falls back to the default ICE range
          # 50000-60000/udp, which is not published here (T004 finding)
          udp_port: 7882
    ports:
      - "7880:7880" # HTTP signaling (ws) + Twirp RoomService
      - "7881:7881" # ICE/TCP
      - "7882:7882/udp" # ICE/UDP (mux)
    extra_hosts:
      # backend runs on the host (./gradlew bootRun, quickstart §2) — the webhook
      # target http://backend:8080 must resolve to the docker host
      - "backend:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local dex IdP for manual SSO verification (003-sso-identity-providers
  # quickstart.md; config: deploy/local/dex/config.yaml). Opt-in via the `sso`
  # profile, mirroring the opt-in SSO_DEX_ENABLED flag of the backend (T042).
  dex:
    image: dexidp/dex:v2.42.1
    container_name: webchat-dex
    profiles: ["sso"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    restart: unless-stopped

volumes:
  postgres-data:
  sonar-postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
