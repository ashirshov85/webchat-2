# LiveKit SFU — media plane of video conferences (009-video-conferences T004,
# contracts/livekit-integration.md §1, research.md §11). Own manifest instead
# of the LiveKit helm chart: the cluster pipeline is plain kustomize
# (deploy/k8s/base + overlays), helm would break its uniformity (research §11).
# Topology per LiveKit self-hosting requirements, adapted to this cluster:
#   - hostNetwork: true — RTC ports (7881/tcp ICE, 7882/udp mux, 5349/tcp
#     TURN/TLS) are node-wide, a Service cannot proxy UDP media; hence exactly
#     ONE pod per node (required podAntiAffinity) and ClusterFirstWithHostNet
#     so the webhook URL/redis host resolve cluster services.
#   - Service routes only 7880 (HTTP signaling + Twirp RoomService); TLS for
#     browser clients terminates on the ingress (cluster convention), the RTC
#     ports above must be allowed to the node by the cloud firewall.
#   - distributed mode via Redis (prod: dedicated instance/logical DB — LiveKit
#     prefixes its keys with `lk:`; dev overlay shares the stand Redis).
#   - `room.enable_remote_unmute: true` is mandatory: without it the server
#     rejects MutePublishedTrack — all moderation of №49 breaks (FR-008).
# Secrets stay env-only (constitution V): the API key/secret pair comes from
# the LIVEKIT_KEYS env; prod keeps it in an out-of-repo `livekit-keys` Secret,
# the dev overlay commits the placeholder pair of the local compose (T003).
#
# TURN/TLS (networks blocking WebRTC) is a prod concern (research §11): a
# future prod overlay appends the config section below + its cert Secret
# volume — kept out of the base so environments without the certificate stay
# deployable (the dev stand reaches its nodes directly):
#   turn:
#     enabled: true
#     domain: turn.example.com        # public TURN hostname
#     tls_port: 5349                  # declared below in containerPorts
#     cert_file: /etc/livekit/turn/tls.crt
#     key_file: /etc/livekit/turn/tls.key
#   volumes:
#     - name: turn-tls
#       secret:
#         secretName: livekit-turn-tls   # out-of-repo, cluster-issuer precedent
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  labels:
    app: livekit
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - 0.0.0.0
    # webhook.api_key = NAME of a key from LIVEKIT_KEYS: its secret signs the
    # webhook JWT (sha256 body hash verified by WebhookReceiver,
    # livekit-integration §5); devkey matches the dev pair of the overlay
    webhook:
      api_key: devkey
      urls:
        - http://backend:8080/api/internal/conferences/livekit/webhook
    room:
      enable_remote_unmute: true
    rtc:
      tcp_port: 7881
      # single UDP mux port — one firewall rule is enough; a prod overlay
      # widens to port_range_start/end when scale demands it (research §11)
      udp_port: 7882
    # distributed mode placeholder: prod overlay points a dedicated Redis
    # instance/logical DB; dev shares the stand instance (research §11)
    redis:
      address: redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels:
    app: livekit
spec:
  # Media capacity scales horizontally: one pod per node, replicas follow the
  # media node count (research §12: ~10–14 nodes for the full prod budget);
  # the dev stand is a single node (T068 load validation target).
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate: the required one-pod-per-node anti-affinity makes a surge pod
  # unschedulable next to the old one — RollingUpdate would deadlock
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      hostNetwork: true
      # hostNetwork silently drops the default ClusterFirst DNS — restore it:
      # the webhook URL and redis host are cluster service names
      dnsPolicy: ClusterFirstWithHostNet
      # service links would inject LIVEKIT_PORT=tcp://10.x.x.x:7880 for the
      # `livekit` Service — livekit-server parses that env as its port number
      # and crashes on startup; every address here resolves via DNS anyway
      enableServiceLinks: false
      # graceful drain of active calls on node updates/drain: upper bound ~5h
      # (LiveKit helm chart recommendation, research §11)
      terminationGracePeriodSeconds: 18000
      affinity:
        # LiveKit requirement: exactly one server pod per node — RTC ports are
        # node-wide and would collide
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: livekit
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: livekit
          # Placeholder: the version is pinned per environment by the overlay
          # (`kustomize edit set image livekit=…`) — media-plane releases are
          # independent of backend/frontend ones (research §11)
          image: livekit:placeholder
          args:
            - --config=/etc/livekit/livekit.yaml
            # advertise the node IP explicitly: auto-detection may pick a
            # wrong interface on multi-NIC nodes (same approach as the
            # official helm chart); $(POD_IP) expands by kubelet
            - --node-ip=$(POD_IP)
          env:
            # API key/secret pair(s) "<key>: <secret>" — the only place the
            # media-plane credentials live (constitution V). Prod: out-of-repo
            # Secret, created like the jwt-keys precedent (backend-auth-env):
            #   kubectl -n <env> create secret generic livekit-keys \
            #     --from-literal=keys='<api key>: <api secret>'
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-keys
                  key: keys
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            # with hostNetwork these are informational/documented — traffic
            # hits the node ports directly, not through the Service
            - name: http
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
            - name: turn-tls
              containerPort: 5349
              protocol: TCP
          # the turn-tls port listens only when a prod overlay enables the
          # turn config section (see header); without it the port stays closed
          resources:
            # dev stand budget (T068: VPS 4 vCPU / 6 GB, target ~10
            # simultaneous 1:1 calls); prod overlays resize per the capacity
            # formula of research §12
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  labels:
    app: livekit
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    # Signaling + Twirp only: backend reaches LIVEKIT_URL=http://livekit:7880,
    # ingress terminates browser wss. RTC media (7881 tcp / 7882 udp / 5349
    # turn) flows to the hostNetwork node ports directly — never proxied here.
    - name: http
      port: 7880
      targetPort: http
      protocol: TCP
