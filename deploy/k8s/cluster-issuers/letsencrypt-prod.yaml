# ClusterIssuer: Let's Encrypt production, HTTP-01 challenge via ingress-nginx.
# Cluster-scoped infrastructure — applied once per cluster, outside the app kustomize tree:
#   kubectl apply -f deploy/k8s/cluster-issuers/letsencrypt-prod.yaml
# Ingresses reference it via annotation: cert-manager.io/cluster-issuer: letsencrypt-prod
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: webmaster@lkshr.ru
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
