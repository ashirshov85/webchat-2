apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Dev-only stateful infrastructure of feature 002 (research.md §10):
  # first durable (PostgreSQL) and ephemeral (Redis) stores + Mailpit.
  # Prod uses managed Postgres/Redis — outside the feature scope.
  - postgres.yaml
  - redis.yaml
  - mailpit.yaml

namespace: dev

# Host per environment (DNS A-record dev.webchat.lkshr.ru -> cluster),
# TLS via cert-manager (cluster issuer letsencrypt-prod, HTTP-01).
# Backend OTLP endpoint (US5): traces go to the in-cluster OTel Collector
# in front of the dev LGTM stack (T028, research.md §21).
patches:
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: webchat
  - path: ingress-tls.yaml
    target:
      kind: Ingress
      name: webchat
  - path: backend-otlp-env.yaml
    target:
      kind: Deployment
      name: backend

# Deploy-time substitution: `kustomize edit set image \
#   backend=${REGISTRY}/${IMAGE_PREFIX}/backend:${SHA} \
#   frontend=${REGISTRY}/${IMAGE_PREFIX}/frontend:${SHA}`.
# Immutable SHA tags only — `latest`/`main` never reach the cluster
# (research.md §12, data-model.md Сущность 4, FR-004).
images:
  - name: backend
    newTag: placeholder
  - name: frontend
    newTag: placeholder
