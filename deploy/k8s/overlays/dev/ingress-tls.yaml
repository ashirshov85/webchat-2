# TLS for dev.webchat.lkshr.ru: cert-manager watches the ingresses (annotation below),
# passes the HTTP-01 challenge through ingress-nginx and fills the webchat-dev-tls
# secret. ssl-redirect makes HTTP-only access impossible (301 to HTTPS).
#
# Strategic merge patch (not JSON6902 ops): map keys merge recursively, so the
# SSE-specific annotations of webchat-sse (proxy-buffering, read/send timeouts,
# feature 004 T020) survive — `op: add` on /metadata/annotations would replace
# the whole map. The name below is ignored: the target selector in
# kustomization.yaml applies this patch to every Ingress with app=webchat.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webchat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - dev.webchat.lkshr.ru
      secretName: webchat-dev-tls
