# Dev-only wiring of backend runtime dependencies (feature 002, T003/T007/T025e):
# PostgreSQL + Redis deployed by this overlay; credentials come from the
# postgres-credentials Secret (dev placeholders, postgres.yaml). The auth
# pepper is a dev placeholder; real ES256 keys arrive via the out-of-repo
# jwt-keys Secret (T028, research.md §4); no real secrets in the repo (SC-005).
# Read by backend/src/main/resources/application.yml (spring.*, auth.*).
#
# Mail (T025e): real SMTP provider (smtp.mail.ru :465 implicit TLS) instead of
# in-cluster Mailpit. The smtp-credentials Secret is created OUTSIDE the repo on
# the cluster (SC-005) with a technical mailbox + "password for external apps":
#   kubectl -n dev create secret generic smtp-credentials \
#     --from-literal=SPRING_MAIL_USERNAME='<technical mailbox>' \
#     --from-literal=SPRING_MAIL_PASSWORD='<external app password>'
# AUTH_MAIL_FROM reads the same SPRING_MAIL_USERNAME key, so From always equals
# the authenticated mailbox by construction. APP_PUBLIC_BASE_URL points one-time
# links at the public SPA (defect: localhost links in Mailpit letters) instead
# of the local default http://localhost:5173. Mailpit stays deployed
# (mailpit.yaml) as a rollback target (T025f: mailpit.dev.svc.cluster.local:1025
# + clearing the auth flags restores the quickstart scenario, no image rebuild);
# local docker-compose keeps Mailpit too (quickstart.md §2).
#
# SSO (003): Google + Yandex + VK + GitHub IdPs on the stand — declared in
# application.yml, disabled by default; this overlay opts in. The
# sso-credentials Secret is created OUTSIDE the repo on the cluster (SC-004)
# with the OAuth client credentials of the providers:
#   kubectl -n dev create secret generic sso-credentials \
#     --from-literal=SSO_GOOGLE_CLIENT_ID='<OAuth client id>' \
#     --from-literal=SSO_GOOGLE_CLIENT_SECRET='<OAuth client secret>' \
#     --from-literal=SSO_YANDEX_CLIENT_ID='<ClientID>' \
#     --from-literal=SSO_YANDEX_CLIENT_SECRET='<ClientSecret>' \
#     --from-literal=SSO_VK_CLIENT_ID='<ClientID>' \
#     --from-literal=SSO_VK_CLIENT_SECRET='<SecureKey>' \
#     --from-literal=SSO_GITHUB_CLIENT_ID='<Client ID>' \
#     --from-literal=SSO_GITHUB_CLIENT_SECRET='<Client Secret>'
# SSO_CALLBACK_URL must equal the Authorized redirect URI registered at each
# provider (console.cloud.google.com / oauth.yandex.ru / id.vk.com — dev.vk.com
# app, «Веб-сайт» type / github.com — Settings → Developer settings → OAuth
# Apps). Endpoints: Google — issuer discovery; Yandex/VK/GitHub — explicit
# (protocol oauth2-userinfo, application.yml sso.providers). ВАЖНО
# (Yandex): доступ «Адрес электронной почты» обязателен в приложении
# oauth.yandex.ru — без него login.yandex.ru/info не возвращает default_email
# и вход завершится email_not_verified / provider_error (research §20, T060).
# ВАЖНО (VK): «Доступ к e-mail» должен быть включён в настройках приложения
# id.vk.com — без него user_info не вернёт user.email и вход завершится без
# адреса (no JIT / no auto-link); VK-ссылки в Deployment optional — ключи
# можно не заводить, пока приложение на ревью. ВАЖНО (GitHub): ключи
# SSO_GITHUB_* в Secret обязательны ДО деплоя — провайдер включён, без ключей
# backend упадёт на старте (fail-fast T007).
#
# Admin seed (008b US4, T036): the idempotent system-account seed
# (AdminSeedRunner) runs on every backend start (admin.seed.enabled=true by
# default). The stand pins ADMIN_SEED_EMAIL so the row is never created under
# the dev default admin@webchat.local (which warns + tags email=default in
# the admin_seed_total metric, T030) — replace it with a mailbox you actually
# read: it receives the 002 reset letters that set the password of the
# passwordless seed form. The seed password is NEVER stored in the repo
# (constitution V): an OPTIONAL ref to the out-of-repo admin-seed Secret —
#   kubectl -n dev create secret generic admin-seed \
#     --from-literal=ADMIN_SEED_PASSWORD='<admin password>'
# absent key → env unset → passwordless JIT form (active row, password_hash
# IS NULL); the seed never overwrites an existing row, so rotating the secret
# only affects fresh deployments without the admin row (research.md §1).
# Local docker-compose is untouched: the backend is not a service there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.dev.svc.cluster.local:5432/webchat
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: redis.dev.svc.cluster.local
            - name: SPRING_MAIL_HOST
              value: smtp.mail.ru
            - name: SPRING_MAIL_PORT
              value: "465"
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: SPRING_MAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: SPRING_MAIL_PASSWORD
            # provider SMTP: auth + implicit TLS on :465 (T025d env plumbing)
            - name: SPRING_MAIL_SMTP_AUTH
              value: "true"
            - name: SPRING_MAIL_SMTP_SSL_ENABLE
              value: "true"
            # transactional sender = authenticated mailbox (see header comment)
            - name: AUTH_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: SPRING_MAIL_USERNAME
            # one-time links point at the public SPA, not the local Vite default
            - name: APP_PUBLIC_BASE_URL
              value: https://aethergram.ru
            - name: AUTH_IP_HASH_PEPPER
              value: dev-only-pepper-placeholder
            # ES256 access-token keys (T028, research.md §4): kid=P-256 PKCS#8
            # PEM, comma-separated for several kids; each PEM raw (newlines or
            # \n escapes) or Base64-of-PEM for single-line values. The active
            # kid signs, the others stay verifiable for rotation. Generated
            # OUTSIDE the repo (SC-005) and stored in the jwt-keys Secret:
            #   openssl ecparam -name prime256v1 -genkey -noout |
            #     openssl pkcs8 -topk8 -nocrypt
            #   kubectl -n dev create secret generic jwt-keys \
            #     --from-literal=AUTH_JWT_KEYS='dev-1=<PEM or its Base64>' \
            #     --from-literal=AUTH_JWT_ACTIVE_KID=dev-1
            - name: AUTH_JWT_KEYS
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: AUTH_JWT_KEYS
            - name: AUTH_JWT_ACTIVE_KID
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: AUTH_JWT_ACTIVE_KID
            # SSO Google IdP (003): enable + credentials from the out-of-repo
            # sso-credentials Secret (see header); disabled everywhere without
            # this wiring (local dev, future prod overlays)
            - name: SSO_GOOGLE_ENABLED
              value: "true"
            - name: SSO_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_GOOGLE_CLIENT_ID
            - name: SSO_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_GOOGLE_CLIENT_SECRET
            # SSO Yandex IdP (003): same out-of-repo sso-credentials Secret
            - name: SSO_YANDEX_ENABLED
              value: "true"
            - name: SSO_YANDEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_YANDEX_CLIENT_ID
            - name: SSO_YANDEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_YANDEX_CLIENT_SECRET
            # SSO VK IdP: oauth2-userinfo with device_id binding — same Secret;
            # disabled on the stand (quickstart S8 «Откат»): flip to "true"
            # after the VK app passes review / when login checks resume.
            # The secretKeyRefs are optional: the sso-credentials Secret does
            # not carry the VK keys until the app exists — an optional ref
            # leaves the env unset, which the disabled provider tolerates
            # (empty ${SSO_VK_*:} defaults, T007); drop `optional` after the
            # keys are added so a missing key fails loudly again.
            - name: SSO_VK_ENABLED
              value: "false"
            - name: SSO_VK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_VK_CLIENT_ID
                  optional: true
            - name: SSO_VK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_VK_CLIENT_SECRET
                  optional: true
            # SSO GitHub IdP: oauth2-userinfo + /user/emails — same Secret;
            # enabled: the verified primary email of the GitHub account
            # drives JIT/auto-linking (quickstart S9). The secretKeyRefs are
            # NOT optional: an enabled provider fails fast at startup without
            # client-id/secret (T007) — add the SSO_GITHUB_* keys to the
            # sso-credentials Secret before deploying this overlay.
            - name: SSO_GITHUB_ENABLED
              value: "true"
            - name: SSO_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_GITHUB_CLIENT_ID
            - name: SSO_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-credentials
                  key: SSO_GITHUB_CLIENT_SECRET
            # OIDC redirect_uri for every provider (sso.callback-url) — the
            # browser-facing stand URL, registered in Google Cloud Console
            - name: SSO_CALLBACK_URL
              value: https://aethergram.ru/api/v1/auth/sso/callback
            # Admin seed (008b US4, T036): stand mailbox of the seeded system
            # account; without this env the row would be created under the dev
            # default admin@webchat.local (warn + email=default metric tag).
            # Placeholder domain — swap for a mailbox you read before using
            # the 002 reset flow for the seed account.
            - name: ADMIN_SEED_EMAIL
              value: admin@webchat.lkshr.ru
            # Seed password — OPTIONAL out-of-repo admin-seed Secret (see
            # header, constitution V): absent key leaves the env unset →
            # passwordless JIT form (password_hash IS NULL); the seed never
            # updates an existing row, so the secret only matters for fresh
            # deployments without the admin row (research.md §1).
            - name: ADMIN_SEED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-seed
                  key: ADMIN_SEED_PASSWORD
                  optional: true
