name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}

jobs:
  backend-image:
    name: backend-image (build + push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (BuildKit)
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-image:
    name: frontend-image (build + push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (BuildKit)
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:main
          # Browser OTLP endpoint (US5, T028): OTel Collector OTLP HTTP ingress
          # reachable from browsers, e.g. https://otel-dev.webchat.lkshr.ru/v1/traces.
          # Baked into the bundle at build time — public info, hence a variable,
          # not a secret (FR-014).
          build-args: |
            VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${{ vars.VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: deploy-dev (apply + rollout status)
    needs: [backend-image, frontend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig from KUBE_CONFIG secret
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Pin overlay images to immutable SHA tags
        working-directory: deploy/k8s/overlays/dev
        run: |
          kustomize edit set image \
            backend="${REGISTRY}/${IMAGE_PREFIX}/backend:${GITHUB_SHA}" \
            frontend="${REGISTRY}/${IMAGE_PREFIX}/frontend:${GITHUB_SHA}"

      - name: Apply dev overlay (retry x3)
        working-directory: deploy/k8s/overlays/dev
        run: |
          for attempt in 1 2 3; do
            if kubectl apply -k .; then
              echo "kubectl apply succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "kubectl apply attempt ${attempt} failed" >&2
            sleep 10
          done
          echo "kubectl apply failed after 3 attempts" >&2
          exit 1

      - name: Wait for backend rollout
        run: kubectl rollout status deploy/backend -n dev --timeout=180s

      - name: Wait for frontend rollout
        run: kubectl rollout status deploy/frontend -n dev --timeout=180s
