# 007 tasks.md T003: tightened presence windows for the IT profile —
# SC-003 budget must not flake on poller slack, and registrations must not
# expire mid-scenario longer than TTL; read by T011/T023/T026
#
# T036 (scheduler ownership): the IT JVM caches many Spring contexts
# against ONE shared Redis; running this scheduler in every cached
# context would turn every due offq/watch entry into a 50/50 race
# between pollers for the counter increments the presence ITs assert.
# The pollers are therefore OFF for every test context except the
# presence context, where PresenceTestSupport re-enables them — exactly
# ONE poller owner per test JVM (production always runs them: the
# conditional defaults to TRUE).
#
# 008a T001 (baseline repair): Boot's auto-configured SimpleAsyncTaskScheduler
# runs EVERY fixed-delay task on ONE shared single-thread ScheduledThreadPoolExecutor
# (SimpleAsyncTaskScheduler.createFixedDelayExecutor, Spring 6.2) — the OutboxPoller
# tick (synchronous SMTP to the compose Mailpit, 1.5–11 s per letter on a slow Docker
# host) monopolizes that thread and starves the 200 ms presence offq/watch pollers far
# past the SC-003 budgets (observed ~8–13 s stall in the US3 AC4 storm). No IT depends
# on asynchronous SMTP delivery (verification tokens are read straight from
# email_outbox; EmailOutboxResilienceIT drives dispatchPending synchronously and pins
# this very delay for its own context) — the tick is therefore disabled JVM-wide,
# which also removes all real SMTP traffic from the IT JVM on hosts with slow Docker
# networking.
auth:
  outbox:
    poll-fixed-delay: 1h

chats:
  typing:
    # 008a T008: accelerated typing windows for the IT profile (the
    # presence T003 pattern) — the SC-003 self-expiry budget (stopped ≤
    # TTL + poll-interval) must not flake on poller slack, and scenarios
    # must not wait out the production 8 s TTL. The poller is OFF for
    # EVERY test context of the JVM (the T036 single-poller-owner rule
    # against the ONE shared Redis); TypingTestSupport (T027) re-enables
    # it — exactly ONE poller owner per test run, production always runs
    # it. The flood capacities keep their production values: the TypingIT
    # flood leg drains the bucket on purpose.
    poller-enabled: false
    state-ttl: 3s
    poll-interval: 200ms

presence:
  poller-enabled: false
  ttl: 3s
  hysteresis: 2s
  heartbeat-interval: 1s
  poller-interval: 200ms
  rate-limit:
    # T015 (№37): the tightened 3 s TTL must absorb a whole throttle episode
    # with the contract's 3× headroom — capacity 30 over the 30 s window
    # refills 1 token/s, so a drained bucket answers Retry-After: 1 and the
    # T011 recovery beat lands ~2 s after the last renewal (drain ~30 beats,
    # safely below the 60-attempt burst cap)
    heartbeats-per-window: 30
    # T016 (№36): the T011 convergence helpers poll №36 every 200 ms inside
    # windows of ~5 s — a worst-case scenario spends ≤ ~40 snapshots for one
    # observer, far below capacity 120; the T016 flood leg still drains the
    # bucket on purpose (burst cap 150 attempts) and sees Retry-After: 1 at
    # the 2 token/s refill of the 60 s window
    snapshots-per-minute: 120
