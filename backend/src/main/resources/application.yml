spring:
  application:
    name: backend
  main:
    banner-mode: "off"
  datasource:
    # Dev defaults mirror deploy/local/docker-compose.yml; real credentials come from env / K8s Secrets (SC-005)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webchat}
    username: ${SPRING_DATASOURCE_USERNAME:webchat}
    password: ${SPRING_DATASOURCE_PASSWORD:webchat}
  flyway:
    enabled: true
    # migrations live in classpath:db/migration (V1–V6, data-model.md §1–§6)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    # dev: Mailpit SMTP (quickstart.md §2); real provider via SPRING_MAIL_* env only,
    # no code changes (SmtpEmailGateway, DIP-port unchanged); secrets only env/K8s Secrets (SC-005)
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # provider SMTP auth; defaults (false/empty) keep local Mailpit unchanged
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          ssl:
            # implicit TLS (port 465)
            enable: ${SPRING_MAIL_SMTP_SSL_ENABLE:false}
          starttls:
            # STARTTLS (port 587)
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

server:
  port: 8080
  # Trust X-Forwarded-* from the single ingress hop; client IP = leftmost XFF (research.md §7)
  forward-headers-strategy: framework
  servlet:
    session:
      persistent: false
      tracking-modes: ""

app:
  # SPA origin for one-time links in transactional letters (api-contract.md §1);
  # dev default is the Vite server, prod value from env (quickstart.md §2)
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}

auth:
  token:
    # research.md §11: access 5 min (FR-006), refresh 3 days sliding (FR-006)
    access-ttl: 5m
    refresh-ttl: 3d
    # one-time links: email_verification 24 h (FR-002), password_setup 1 h (FR-003), password_reset 1 h (FR-010)
    email-verification-ttl: 24h
    password-setup-ttl: 1h
    password-reset-ttl: 1h
  resend:
    # second-tier PG cooldown per account (US1-6, data-model.md §5); first tier = rl:email:resend bucket
    cooldown: 60s
  outbox:
    # dispatcher tick (research.md §11: 5 s fixed delay); attempts 2-4 retry every 60 s (T021)
    poll-fixed-delay: 5s
  password:
    # top-10k weak passwords, lowercase (research.md §3, FR-004)
    blocklist-path: classpath:auth/password-blocklist.txt
  ratelimit:
    # "<count>/<window>" per key; research.md §11 (FR-009)
    register:
      ip: 5/1h
      email: 3/1h
    resend:
      ip: 3/1h
      email: 3/1h
    login:
      ip: 10/1m
      account: 10/1m
      # brute-force counter (research.md §8, SC-004): delay = min(base * 2^(n-3), max)
      # from the 4th accumulated failure; lockout at >= 10 accumulated failures for the window
      throttle:
        base-delay: 250ms
        max-delay: 15s
        lockout-threshold: 10
        window: 15m
    password-reset:
      ip: 5/1h
      email: 3/1h
    # token-bearing POSTs: IP-only key, flood guard (research.md §11)
    confirm:
      ip: 30/1m
    password:
      ip: 30/1m
    reset-confirm:
      ip: 30/1m
    refresh:
      ip: 30/1m
    # 003 research.md §9 (FR-009): the five SSO routes, per source IP;
    # authorize/link-authorize are stricter (10/1m) — they create flow
    # contexts in Redis; the GET routes (providers/callback) ride the same
    # table since T047; values are the normative source mirrored by
    # contracts/sso-api.md §1–5 and quickstart S6.2
    sso:
      providers:
        ip: 30/1m
      authorize:
        ip: 10/1m
      callback:
        ip: 30/1m
      token:
        ip: 30/1m
      link-authorize:
        ip: 10/1m
  mail:
    # transactional sender address; prod value from env / K8s Secret (research.md §6)
    from: ${AUTH_MAIL_FROM:noreply@webchat.local}
  # secrets come from env / K8s Secrets only (SC-005); no values in the repo
  ip-hash-pepper: ${AUTH_IP_HASH_PEPPER}
  jwt:
    # AUTH_JWT_KEYS: comma-separated kid=P-256 PEM (raw or Base64-of-PEM);
    # active kid signs, the rest stay verifiable for rotation (research.md §4)
    keys: ${AUTH_JWT_KEYS}
    active-kid: ${AUTH_JWT_ACTIVE_KID}

sso:
  # External identity providers (003-sso-identity-providers, data-model.md §4);
  # bound to SsoProperties (T007) with fail-fast validation on startup.
  # providers map is keyed by provider id (^[a-z0-9][a-z0-9-]{0,63}$);
  # declaration order = order in GET /auth/sso/providers (LinkedHashMap binding).
  # Provider schema (research.md §4):
  #   <id>:
  #     display-name: ...                  # shown on the login screen
  #     enabled: true                      # default true; disabled = hidden, its flows rejected, links kept (US4-3)
  #     trusted-for-email-linking: false   # default false; opt-in allowlist for auto-linking by verified email
  #     client-id: ...
  #     client-secret: ${SSO_<ID>_CLIENT_SECRET}
  #                                        # env / K8s Secret only, never in repo (SC-004);
  #                                        # providers disabled by default may use an empty default: ${SSO_<ID>_CLIENT_SECRET:}
  #     issuer-uri: https://...            # OIDC discovery (lazy cache, research §5) OR explicit endpoints:
  #     # authorization-uri: https://...
  #     # token-uri: https://...
  #     # userinfo-uri: https://...
  #     # jwks-uri: https://...
  #     scopes: [openid, email]            # default
  providers:
    # Local dex IdP (deploy/local/dex, docker compose --profile sso; T042).
    # Opt-in like its container profile: without SSO_DEX_ENABLED the provider
    # stays disabled, its empty-secret default is allowed by the fail-fast
    # validation for disabled providers (T007), so runs without SSO env start
    # cleanly; quickstart «Настройка и запуск»: SSO_DEX_ENABLED=true +
    # SSO_DEX_CLIENT_SECRET=dev-secret (the dev-only dummy from deploy/local/dex).
    dex:
      display-name: dex
      enabled: ${SSO_DEX_ENABLED:false}
      # quickstart S3: allowlist for auto-linking by verified provider email
      trusted-for-email-linking: true
      client-id: webchat
      # env / K8s Secret only (SC-004); empty default keeps the provider opt-in
      client-secret: ${SSO_DEX_CLIENT_SECRET:}
      # explicit endpoints of the dex container on :5556 — no discovery leg
      authorization-uri: http://localhost:5556/auth
      token-uri: http://localhost:5556/token
      userinfo-uri: http://localhost:5556/userinfo
      jwks-uri: http://localhost:5556/keys
      scopes: [openid, email]
  # SSO flow context sso:flow:<state> — single-use, data-model.md §5
  flow-ttl: 10m
  # Handshake code sso:handshake:<sha256(code)> — single-use exchange for SPA (research §2)
  handshake-ttl: 2m
  # OIDC redirect_uri. Local dev runs without an ingress — the backend answers
  # on :8080 directly, matching the dex redirect-uri fixed by quickstart
  # «Предусловия» (T042); real deployments override via env / K8s Secret.
  callback-url: ${SSO_CALLBACK_URL:http://localhost:8080/api/v1/auth/sso/callback}

management:
  # Common tag required on every metric (contracts/technical-endpoints.md §1)
  observations:
    key-values:
      application: backend
  endpoints:
    web:
      exposure:
        # metrics: p95 verification for SC-003 in T057b (same data as prometheus)
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # server-side p95 SLO budget (SC-003: <= 500 ms)
      slo:
        http.server.requests: 500ms
  otlp:
    tracing:
      # Env var wins in k8s (dev overlay, T028); localhost default keeps tests/local runs green without a collector
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
