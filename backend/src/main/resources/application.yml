spring:
  application:
    name: backend
  main:
    banner-mode: "off"

server:
  port: 8080
  servlet:
    session:
      persistent: false
      tracking-modes: ""

management:
  # Common tag required on every metric (contracts/technical-endpoints.md §1)
  observations:
    key-values:
      application: backend
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    tracing:
      # Env var wins in k8s (dev overlay, T028); localhost default keeps tests/local runs green without a collector
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
