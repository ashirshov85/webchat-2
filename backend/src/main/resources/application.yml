spring:
  application:
    name: backend
  main:
    banner-mode: "off"

server:
  port: 8080
  servlet:
    session:
      persistent: false
      tracking-modes: ""

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
